name: CCAI device preview E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-preview-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright runner
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build isolated static preview
        run: npm run build:static
      - name: Generate ephemeral HTTPS certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -keyout "$RUNNER_TEMP/ccai-preview-key.pem" \
            -out "$RUNNER_TEMP/ccai-preview-cert.pem" \
            -subj "/CN=ccai.ur-project.biz" \
            -addext "subjectAltName=DNS:ccai.ur-project.biz,IP:127.0.0.1"
      - name: Run device and workflow checks
        run: npx playwright test --config=playwright.config.cjs
        env:
          CI: 'true'
          NO_PROXY: ccai.ur-project.biz,127.0.0.1,localhost
          CCAI_TEST_TLS_CERT: ${{ runner.temp }}/ccai-preview-cert.pem
          CCAI_TEST_TLS_KEY: ${{ runner.temp }}/ccai-preview-key.pem
      - name: Upload screenshots, HTML report, and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccai-device-preview-e2e-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
