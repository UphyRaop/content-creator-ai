ked or verified capacity</small></article><article class="billing-card"><span class="eyebrow">NEXT RESET</span><strong>${escapeHtml(nextBillingReset())}</strong><span>Calendar-month preview</span><small>No live quota reset is configured</small></article></section><section class="panel billing-panel"><div class="billing-section-head"><div><h2>Monthly capacity and cost preview</h2><p class="sub">Simulated planning values · actual provider usage unavailable</p></div><span class="pill">November demo</span></div><div class="billing-usage-grid"><div class="billing-meter-card"><div class="billing-meter-head"><strong>Provisional video render target</strong><span>${usagePct}% of 300 unverified planning target</span></div><div class="billing-meter" role="img" aria-label="Simulated counts: ${demo.actualVideos} completed, ${demo.reservedVideos} reserved, of a provisional 300-video target"><i style="width:${usagePct}%"></i></div><div class="billing-breakdown"><div><span>Completed · simulated count</span><b>${demo.actualVideos}</b></div><div><span>Reserved · demo estimate</span><b>${demo.reservedVideos}</b></div><div><span>Remaining · demo planning target</span><b>${remainingVideos}</b></div><div><span>Cost · estimated demo</span><b>RM ${demo.estimatedCost.toFixed(2)}</b></div></div></div><div class="billing-money-card"><h3>Illustrative envelope · not an approved budget</h3><div class="billing-money-row"><span>UI-only sample envelope</span><b>RM ${demo.monthlyBudget.toFixed(2)}</b></div><div class="billing-money-row"><span>Actual provider cost · verified</span><b>Unavailable</b></div><div class="billing-money-row"><span>Estimated usage cost · demo</span><b>RM ${demo.estimatedCost.toFixed(2)}</b></div><div class="billing-money-row"><span>Reserved estimated cost · demo</span><b>RM ${demo.reservedCost.toFixed(2)}</b></div><div class="billing-money-row billing-remaining"><span>Unspent illustrative envelope</span><b>RM ${remainingBudget.toFixed(2)}</b></div><p class="help">RM0 is the target hosting cost, not a verified bill. The RM500 sample envelope is illustrative only, not an approved spending budget. Actual billed cost, credits, taxes, and resource-level spend are unavailable.</p></div></div><section class="billing-resource-panel" aria-labelledby="billing-resource-title"><div class="billing-section-head"><div><h3 id="billing-resource-title">Per-resource usage status</h3><p class="sub">No verified limits or measurements are connected for these resources.</p></div><span class="pill billing-unverified">UNAVAILABLE</span></div><div class="billing-resource-list">${unavailableResources.map(name=>`<div class="billing-resource-row"><div class="billing-resource-name"><strong>${escapeHtml(name)}</strong><span>Plan limit unavailable</span></div><div class="billing-resource-meter" role="img" aria-label="${escapeAttr(name)} meter unavailable: no verified usage or limit"><i></i></div><div class="billing-resource-values"><span>Actual <b>Unavailable</b></span><span>Reserved <b>Unavailable</b></span><span>Remaining <b>Unavailable</b></span></div></div>`).join('')}</div><p class="help">Meters are intentionally empty until a verified resource plan and usage source are configured; these rows do not represent zero usage.</p></section><div class="billing-thresholds"><div class="billing-threshold"><b>80%</b><span>Heads-up threshold · preview only</span></div><div class="billing-threshold warning"><b>85%</b><span>Warning threshold · preview only</span></div><div class="billing-threshold block"><b>90%</b><span>Block threshold · no enforcement connected</span></div></div><p class="help">Current sample is ${usagePct}% and has not reached these illustrative thresholds. Thresholds do not currently alert, cap, or block any real workload.</p></section><section class="billing-stats"><article class="panel"><span class="eyebrow">DAILY · SIMULATED</span><h2>${demo.dailyVideos} videos today</h2><p>Estimated daily cost: <strong>RM ${demo.dailyCost.toFixed(2)}</strong></p><small>No verified daily usage available.</small></article><article class="panel"><span class="eyebrow">MONTHLY · SIMULATED</span><h2>${demo.actualVideos} completed · ${demo.reservedVideos} reserved</h2><p>Estimated monthly cost: <strong>RM ${demo.estimatedCost.toFixed(2)}</strong></p><small>No verified monthly usage available.</small></article></section><section class="panel billing-panel"><div class="billing-section-head"><div><h2>Usage history</h2><p class="sub">Illustrative sample entries only</p></div><span class="pill billing-unverified">NOT GOOGLE TELEMETRY</span></div><div class="billing-history-wrap"><table class="billing-history"><caption class="sr-only">Simulated render usage history</caption><thead><tr><th scope="col">Date</th><th scope="col">Completed</th><th scope="col">Reserved</th><th scope="col">Estimated cost</th><th scope="col">Data status</th></tr></thead><tbody><tr><td>Today · demo</td><td>4</td><td>1</td><td>RM 4.60</td><td>Simulated</td></tr><tr><td>Yesterday · demo</td><td>5</td><td>0</td><td>RM 5.20</td><td>Simulated</td></tr><tr><td>This month · sample</td><td>${demo.actualVideos}</td><td>${demo.reservedVideos}</td><td>RM ${demo.estimatedCost.toFixed(2)}</td><td>Estimated</td></tr></tbody></table></div><div class="billing-empty"><strong>Verified billing history unavailable</strong><span>Connect a reviewed metrics source before using this section for operational or financial decisions.</span></div></section><section class="panel billing-protection"><div class="billing-section-head"><div><h2>Protection status</h2><p class="sub">Preview controls are local UI simulations only.</p></div><span class="pill billing-unverified">${status}</span></div><div class="billing-protection-grid"><div><b>Live metric feed</b><span>Unavailable · not connected</span></div><div><b>80 / 85 / 90 guardrails</b><span>Policy preview · not enforced</span></div><div><b>GCP stop action</b><span>Not connected · no infrastructure control</span></div></div><button class="danger billing-stop" type="button" onclick="toggleBillingEmergencyStop()">${billingDemoStopped?'Resume simulated protection preview':'Simulate emergency stop'}</button><p class="help" role="status" aria-live="polite">${billingDemoStopped?'Preview state only. Real workloads are unaffected.':'This button changes only this page’s demo status; it does not stop Google Cloud infrastructure or real jobs.'}</p><div class="billing-blocked"><strong>Production operations blocked</strong><span>Enable only after real metrics, budget accounting, and server-side admission controls are verified.</span></div></section>`}
function renderBackup(){view.innerHTML=`${managementTabs()}<div class="dashboard-heading"><div><div class="eyebrow">PORTABLE PROJECT DATA</div><h1>Backup & restore</h1><p>Exports include project settings, approvals, script versions and references.</p></div></div><section class="panel"><h2>Export library</h2><p class="sub">Download all projects and reusable libraries as one JSON backup.</p><div class="actions"><button class="primary" onclick="exportLibrary()">Export complete library</button><button class="secondary" onclick="document.querySelector('#importData').click()">Import backup</button><input id="importData" type="file" accept="application/json,.json" hidden></div><p class="help">Imports are validated and added as new records. Existing projects and libraries are never overwritten.</p></section><div class="projects-grid">${projectList.map(p=>`<article class="project-card"><h2>${escapeHtml(p.title)}</h2><p class="project-stage">${escapeHtml(projectStatus(p))} · ${escapeHtml(p.stage||'Idea')}</p><button class="secondary" onclick="exportOne('${p.id}')">Export this project</button></article>`).join('')||'<div class="empty">No projects are available to export yet.</div>'}</div>`;document.querySelector('#importData')?.addEventListener('change',handleImportFile)}
function drawManagement(){document.body.classList.add('dashboard-mode');document.querySelector('#activeProjectName').textContent='Project management';document.querySelector('#themeToggle').textContent=document.documentElement.dataset.theme==='light'?'◐ Dark mode':'☼ Light mode';if(dashboardSection==='projects')renderProjectManager();else if(dashboardSection==='queue')renderQueue();else if(dashboardSection==='billing')renderCloudBilling();else if(dashboardSection==='backup')renderBackup();else renderLibrary(dashboardSection)}
async function saveEntity(collection,record){libraryData[collection]=libraryData[collection].filter(item=>item.id!==record.id).concat(record);saveLocalLibrary();try{const response=await fetch('/api/entities/'+collection,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({record})});if(!response.ok)throw Error('SQLite unavailable')}catch{} }
async function saveEntityForm(collection){const config=collections[collection],existing=libraryEdit?.collection===collection?entityRecord(collection,libraryEdit.id):null;const name=document.querySelector('#entityName')?.value.trim();if(!name){say('Enter a name before saving.',true);return}const record={...(existing||{}),id:existing?.id||entityId(),name,referenceImages:existing?.referenceImages||[]};for(const [key] of config.fields)record[key]=document.querySelector('#entity-'+key)?.value.trim()||'';if(collection==='channels'){record.durationMinutes=Number(record.durationMinutes||1);record.aspectRatio=record.aspectRatio||'16:9'}await saveEntity(collection,record);libraryEdit=null;say(`${singularLabel(collection)} saved.`);draw()}
async function deleteEntityAction(collection,id){const item=entityRecord(collection,id);if(!confirm(`Delete “${item?.name||'this item'}” from the reusable library? Existing project snapshots are preserved.`))return;libraryData[collection]=libraryData[collection].filter(x=>x.id!==id);saveLocalLibrary();try{await fetch('/api/entities/'+collection+'?id='+encodeURIComponent(id),{method:'DELETE'})}catch{}say('Library item deleted.');draw()}
async function duplicateEntityAction(collection,id){const source=entityRecord(collection,id);if(!source)return;const copy={...JSON.parse(JSON.stringify(source)),id:entityId(),name:'Copy of '+source.name};await saveEntity(collection,copy);say('Library item duplicated.');draw()}
async function handleEntityUploads(input){const collection=input.dataset.libraryCollection,id=libraryEdit?.collection===collection?libraryEdit.id:null;let record=id?entityRecord(collection,id):null;if(!record){say('Create and save this item first, then edit it to add reference images.',true);input.value='';return}const files=[...input.files||[]];if((record.referenceImages?.length||0)+files.length>12){say('A library item can hold up to 12 images.',true);input.value='';return}try{const images=await Promise.all(files.map(file=>new Promise((resolve,reject)=>{if(file.size>2*1024*1024||!/^image\/(png|jpeg|webp|gif)$/.test(file.type)){reject(Error(`${file.name} must be PNG, JPEG, WebP, or GIF under 2 MB.`));return}const reader=new FileReader();reader.onload=()=>resolve({name:file.name,type:file.type,dataUrl:reader.result});reader.onerror=()=>reject(Error('Could not read '+file.name));reader.readAsDataURL(file)})));record.referenceImages=[...(record.referenceImages||[]),...images];await saveEntity(collection,record);say(`${images.length} reference image${images.length===1?'':'s'} saved.`);draw()}catch(error){say(error.message,true)}input.value=''}
async function removeEntityImage(collection,id,index){const record=entityRecord(collection,id);if(!record)return;record.referenceImages.splice(index,1);await saveEntity(collection,record);draw()}
async function updateProjectMetadata(id,key,value){const item=projectList.find(p=>p.id===id);if(!item)return;try{let payload=item.payload;if(!payload){const response=await fetch('/api/projects/'+encodeURIComponent(id));payload=(await response.json()).project.payload}else payload={...payload};payload[key]=value;if(key==='projectStatus')payload.projectStatus=value;if(key==='priority')payload.priority=value;const response=await fetch('/api/projects/'+encodeURIComponent(id),{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({payload})});if(!response.ok)throw Error();item.payload=payload;item.status=payload.projectStatus;item.priority=payload.priority;item.updatedAt=new Date().toISOString()}catch(error){if(error?.status===401)authExpired();say('Could not update server project: '+error.message,true)}draw()}
function downloadJson(filename,data){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url)}
async function exportOne(id){let p=loadBrowserProjects().find(x=>x.id===id);if(!p){const response=await fetch('/api/projects/'+encodeURIComponent(id));if(response.ok){const {project}=await response.json();p={id:project.id,title:project.title,payload:project.payload,createdAt:project.createdAt,updatedAt:project.updatedAt}}}if(p)downloadJson(`ccai-project-${p.title.replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.json`,{format:'ccai-project',version:1,project:p})}
async function exportLibrary(){let projects=loadBrowserProjects();if(!browserStorage){try{const list=await (await fetch('/api/projects')).json();projects=await Promise.all(list.projects.map(async item=>(await (await fetch('/api/projects/'+encodeURIComponent(item.id))).json()).project))}catch{}}downloadJson('ccai-library-backup.json',{format:'ccai-library',version:1,exportedAt:new Date().toISOString(),projects,library:libraryData})}
function validImportPayload(payload){
 if(!payload||typeof payload!=='object'||Array.isArray(payload))return false;
 const settings=payload.settings||{};
 if(settings.referenceImages!==undefined&&(!Array.isArray(settings.referenceImages)||settings.referenceImages.length>12||settings.referenceImages.some(img=>!img||typeof img.dataUrl!=='string'||img.dataUrl.length>2800000||!/^data:image\/(png|jpeg|webp|gif);base64,/i.test(img.dataUrl))))return false;
 if(settings.referenceVideos!==undefined&&(!Array.isArray(settings.referenceVideos)||settings.referenceVideos.length>20||settings.referenceVideos.some(url=>typeof url!=='string'||!/^https:\/\//i.test(url))))return false;
 if(payload.scriptVersions!==undefined&&(!Array.isArray(payload.scriptVersions)||payload.scriptVersions.length>200||payload.scriptVersions.some(item=>!item||typeof item.text!=='string')))return false;
 if(payload.scenes!==undefined){
  if(!Array.isArray(payload.scenes)||payload.scenes.length>100)return false;
  for(const scene of payload.scenes){
   if(!scene||typeof scene!=='object')return false;
   const lines=scene.voiceSegments;
   if(lines===undefined)continue;
   if(!Array.isArray(lines)||lines.length>20)return false;
   for(const line of lines){
    if(!line||typeof line.id!=='string'||typeof line.text!=='string'||line.text.length>12000||!Array.isArray(line.versions||[]))return false;
    if((line.versions||[]).some(version=>!version||typeof version.dataUrl!=='string'||version.dataUrl.length>14000000||!/^data:audio\/(wav|mpeg|mp3|mp4|x-m4a|aac|ogg|webm|x-wav);base64,/i.test(version.dataUrl)))return false;
   }
  }
 }
 if(payload.characterIds!==undefined&&(!Array.isArray(payload.characterIds)||payload.characterIds.some(id=>typeof id!=='string')))return false;
 if(payload.locationIds!==undefined&&(!Array.isArray(payload.locationIds)||payload.locationIds.some(id=>typeof id!=='string')))return false;
 return true
}
async function handleImportFile(event){const file=event.target.files?.[0];if(!file)return;try{if(file.size>40*1024*1024)throw Error('Backup exceeds 40 MB.');const data=JSON.parse(await file.text());if(!['ccai-library','ccai-project'].includes(data.format)||data.version!==1)throw Error('Unsupported CCAI backup format.');const projects=data.format==='ccai-project'?[data.project]:data.projects;if(!Array.isArray(projects))throw Error('Backup does not contain a project list.');for(const project of projects){if(!project||typeof project.title!=='string'||!validImportPayload(project.payload))throw Error('A project record is invalid.');if(JSON.stringify(project).length>40_000_000)throw Error('An imported project exceeds the size limit.')}const libraries=data.format==='ccai-library'?(data.library||{}):{};for(const key of Object.keys(collections))if(libraries[key]!==undefined&&(!Array.isArray(libraries[key])||libraries[key].some(item=>!item||typeof item.name!=='string'||!item.name.trim()||typeof item.id!=='string'||(item.referenceImages!==undefined&&(!Array.isArray(item.referenceImages)||item.referenceImages.length>12||item.referenceImages.some(img=>!img||typeof img.dataUrl!=='string'||img.dataUrl.length>2800000||!/^data:image\/(png|jpeg|webp|gif);base64,/i.test(img.dataUrl)))))))throw Error(`Invalid ${collections[key].label} data.`);if(!confirm(`Import ${projects.length} project(s) and reusable records as new copies? Existing records will not be overwritten.`))return;const importedIds={};for(const key of Object.keys(collections)){for(const record of libraries[key]||[]){const copy={...record,id:entityId()};importedIds[record.id]=copy.id;await saveEntity(key,copy)}}for(const source of projects){const payload=JSON.parse(JSON.stringify(source.payload));for(const key of ['seriesId','channelId','brandKitId','locationId'])if(payload[key]&&importedIds[payload[key]])payload[key]=importedIds[payload[key]];for(const key of ['characterIds','locationIds'])if(Array.isArray(payload[key]))payload[key]=payload[key].map(id=>importedIds[id]||id);if(payload.appearanceOverrides)payload.appearanceOverrides=Object.fromEntries(Object.entries(payload.appearanceOverrides).map(([id,value])=>[importedIds[id]||id,value]));for(const scene of payload.scenes||[]){if(scene.locationId&&importedIds[scene.locationId])scene.locationId=importedIds[scene.locationId];if(Array.isArray(scene.characterIds))scene.characterIds=scene.characterIds.map(id=>importedIds[id]||id)}const title='Imported · '+source.title;if(browserStorage){storeBrowserProject({id:makeProjectId(),title,payload:JSON.parse(JSON.stringify(payload)),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()})}else{const response=await fetch('/api/projects',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title,payload})});if(!response.ok)throw Error((await response.json()).error||'Import failed')}}await refreshProjectList();say('Backup imported as new copies. Existing data was preserved.');draw()}catch(error){say(error instanceof Error?error.message:'Could not import backup.',true)}finally{event.target.value=''}}

try{const theme=localStorage.getItem('ccai-theme');if(theme)document.documentElement.dataset.theme=theme}catch{}draw();if(browserStorage){refreshLibrary().then(()=>{ensureDefaultVoiceProfiles();return refreshProjectList()}).then(()=>draw())}else checkServerSession().then(()=>{if(authUser)return refreshLibrary().then(()=>{ensureDefaultVoiceProfiles();return refreshProjectList()})}).then(()=>draw())</script></body></html>
