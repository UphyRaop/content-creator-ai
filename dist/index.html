server. No password or setup token is stored in localStorage or sessionStorage.</p>`:''}</section></div>`}

async function checkServerSession(){if(browserStorage){authChecked=true;return}try{const response=await fetch('/api/auth/session',{credentials:'same-origin',cache:'no-store'});const result=await response.json();if(!response.ok)throw new Error(result.error||'Could not check server session.');authUser=result.authenticated?result.user:null;bootstrapAvailable=!!result.bootstrapAvailable;authMessage=''}catch(error){authUser=null;bootstrapAvailable=false;authMessage=error instanceof Error?error.message:'Could not check server session.'}finally{authChecked=true}}

function captureIdea(){readFormIntoState();const rawVideos=String(document.querySelector('#referenceVideos')?.value||'').split(/\n/).map(x=>x.trim()).filter(Boolean);if(rawVideos.some(url=>!/^https:\/\//i.test(url))){say('Reference video links must use HTTPS. Remove or correct the invalid link.',true);return}state.idea=document.querySelector('#idea').value.trim();state.reference=document.querySelector('#reference').value.trim();state.referenceText=document.querySelector('#referenceText')?.value.trim()||'';if(!state.idea){say('Please enter an idea before continuing.',true);return}if(state.idea.length>4000){say('Keep the idea under 4,000 characters.',true);return}state.storyContinuity=document.querySelector('#storyContinuity')?.value.trim()||'';const selectedSeries=entityRecord('series',state.seriesId);const continuity=[state.storyContinuity||selectedSeries?.previousEpisodeSummary,selectedSeries?.previousEvents,selectedSeries?.characterDevelopment,selectedSeries?.unresolvedStorylines,selectedSeries?.storyline].filter(Boolean).join(' ');const refs=(state.settings.referenceVideos||[]).filter(url=>/^https:\/\//i.test(url)),imageRefs=(state.settings.referenceImages||[]).map(image=>`${image.category}: ${image.name}`).join(', ');state.brief={title:state.idea.slice(0,120),direction:`A concise, visually engaging ${state.settings.durationMinutes}-minute ${state.settings.visualStyle} video in ${state.settings.language}, exploring: ${state.idea}. ${state.reference?`Reference notes: ${state.reference}.`:''} ${state.referenceText?`Reference transcript/context: ${state.referenceText}.`:''} ${continuity?`Series and episode continuity: ${continuity}.`:''} ${state.appliedChannelProfile?.targetAudience?`Target audience: ${state.appliedChannelProfile.targetAudience}.`:''} ${state.appliedChannelProfile?.contentCategory?`Content category: ${state.appliedChannelProfile.contentCategory}.`:''} ${state.appliedChannelProfile?.storytellingPreferences?`Storytelling preferences: ${state.appliedChannelProfile.storytellingPreferences}.`:''} ${entityRecord('brandKits',state.brandKitId)?.visualGuidelines?`Brand visual guidelines: ${entityRecord('brandKits',state.brandKitId).visualGuidelines}.`:''} ${entityRecord('brandKits',state.brandKitId)?.colors?`Brand palette: ${entityRecord('brandKits',state.brandKitId).colors}.`:''} ${entityRecord('brandKits',state.brandKitId)?.typography?`Brand typography: ${entityRecord('brandKits',state.brandKitId).typography}.`:''} ${imageRefs?`Image reference cues: ${imageRefs}.`:''} ${refs.length?`${refs.length} reference video link(s) supplied; remote content is not fetched automatically.`:''} Aspect ratio: ${state.settings.aspectRatio}.`,goal:'Audience: curious viewers. Goal: deliver a clear, memorable takeaway.',audience:'Curious viewers',duration:state.settings.durationMinutes*60,durationMinutes:state.settings.durationMinutes,tone:'Warm and clear',language:state.settings.language,visualStyle:state.settings.visualStyle,aspectRatio:state.settings.aspectRatio,approved:false};say('Simulated creative brief drafted. Review and approve it before script generation.');setStep(1)}
function resetAfterBrief(){state.script='';state.scriptSavedText='';state.scriptVersions=[];state.scriptUsage=[];state.scriptApproved=false;resetAfterScript()}

function readBrief(){return{title:document.querySelector('#btitle')?.value??state.brief.title,direction:document.querySelector('#bdirection')?.value??state.brief.direction,goal:document.querySelector('#baud')?.value??state.brief.goal}}
function saveBrief(){const next=readBrief();if(!next.title.trim()){say('A working title is required.',true);return}const changed=Object.keys(next).some(k=>next[k]!==state.brief[k]);Object.assign(state.brief,next);if(changed){state.brief.approved=false;resetAfterBrief()}say(changed?'Brief edits saved. Approval was reset and dependent work cleared.':'Brief edits saved locally.');draw()}
async function approveBrief(){const next=readBrief();if(!next.title.trim()){say('A working title is required.',true);return}const changed=Object.keys(next).some(k=>next[k]!==state.brief[k]);Object.assign(state.brief,next);if(changed)resetAfterBrief();state.brief.approved=false;try{if(!browserStorage)await requestServerApproval('brief');state.brief.approved=true;scheduleAutosave();say('Creative brief approved. Script generation is unlocked.')}catch(error){state.brief.approved=false;scheduleAutosave();say(error instanceof Error?error.message:'Could not approve the brief on the server.',true)}draw()}
function wordCountPreview(text){const value=String(text||'').trim();if(!value)return 0;const locale={English:'en',Malay:'ms',Chinese:'zh',Tamil:'ta',Spanish:'es',French:'fr',Japanese:'ja',Arabic:'ar'}[state.settings.language]||'en';if(typeof Intl.Segmenter==='function')return Array.from(new Intl.Segmenter(locale,{granularity:'word'}).segment(value)).filter(part=>part.isWordLike).length;return value.split(/\s+/u).length}
function formatDurationPreview(text){return Math.max(1,Math.round(wordCountPreview(text)/140*10)/10)}
function localizedScript(language){const packs={English:["Here is a story worth exploring.","Start with a question viewers recognize. What is changing, and why does it matter to the people in this story?","Show a specific human moment. Describe the setting, introduce the people, and make the central idea clear.","Explain the challenge and show a practical response. Use concrete details, a clear example, and a natural transition so each scene adds something new.","A small, thoughtful step can change what happens next. Connect the idea to an insight viewers can remember and share.","The takeaway is simple: understand the need, choose a useful next step, and keep the human story at the center.","What will you create next? Thanks for watching.",["Look closely at the people involved. What did they notice first? What felt uncertain, and what helped them choose a direction? Show those details clearly, then connect the moment to the larger idea.","Make the next beat concrete. Walk through a practical example, explain what changed, and name the trade-off honestly. Keep the action visible and the language simple.","Pause for a human detail that gives the story texture. Include a small decision, an unexpected obstacle, or a useful conversation, then link it back to the central question."],"What does this look like in practice? It starts by noticing the details and making one clear choice."] ,Malay:["Inilah kisah yang wajar kita terokai.","Mulakan dengan soalan yang mudah difahami. Apakah yang sedang berubah, dan mengapa hal ini penting kepada mereka dalam kisah ini?","Tunjukkan detik manusia yang khusus. Gambarkan latar, kenalkan watak, dan jelaskan idea utama.","Terangkan cabaran dan tunjukkan tindak balas yang praktikal. Gunakan butiran nyata, contoh yang jelas, dan peralihan semula jadi.","Satu langkah kecil yang teliti boleh mengubah apa yang berlaku seterusnya. Hubungkan idea ini dengan pandangan yang mudah diingati.","Kesimpulannya mudah: fahami keperluan, pilih langkah seterusnya yang berguna, dan utamakan kisah manusia.","Apakah yang akan anda hasilkan selepas ini? Terima kasih kerana menonton.",["Perhatikan orang yang terlibat. Apakah yang mereka sedari dahulu? Apakah yang tidak pasti, dan maklumat apakah yang membantu mereka memilih arah? Hubungkan detik itu dengan idea utama.","Jadikan babak seterusnya lebih nyata. Berikan contoh praktikal, terangkan perubahan, dan nyatakan pertimbangannya dengan jujur.","Berhenti seketika pada butiran manusia yang memberi warna kepada kisah ini. Tunjukkan keputusan kecil, halangan yang tidak dijangka, atau perbualan yang berguna."],"Bagaimanakah perkara ini berlaku dalam kehidupan sebenar? Semuanya bermula dengan memerhatikan butiran dan membuat satu pilihan yang jelas."] ,Chinese:["這是一個值得深入探索的故事。","先從觀眾熟悉的問題開始。正在發生什麼變化？為什麼這對故事中的人很重要？","呈現一個具體的人物時刻。描寫場景、介紹人物，並清楚說明核心想法。","說明挑戰並展示實際的回應。加入具體細節、清楚的例子和自然的轉場。","一個用心的小步驟也能改變接下來的發展。把這個想法連結到觀眾能記住的洞見。","重點很簡單：了解需求、選擇有用的下一步，並讓人的故事成為核心。","接下來你想創作什麼？感謝收看。",["仔細觀察故事中的人。他們最先注意到什麼？哪些事情仍不確定？什麼資訊幫助他們選擇方向？把這個時刻連結到更大的想法。","讓下一段更具體。說明一個實際例子、發生的變化，以及其中的取捨。讓行動清楚可見，語言保持簡單。","停留在一個能呈現故事質感的人物細節。加入一個小決定、意外障礙或有意義的對話。"],"這在實際生活中是什麼樣子？從觀察細節並做出清楚選擇開始。"] ,Tamil:["இந்தக் கதையை ஆராய்வது பயனுள்ளதாக இருக்கும்.","பார்வையாளர்கள் அறிந்த கேள்வியுடன் தொடங்குங்கள். என்ன மாறுகிறது, இந்தக் கதையில் உள்ளவர்களுக்கு அது ஏன் முக்கியம்?","ஒரு மனித தருணத்தைத் தெளிவாகக் காட்டுங்கள். இடத்தை விவரித்து, கதாபாத்திரங்களை அறிமுகப்படுத்தி, மையக் கருத்தை விளக்குங்கள்.","சவாலை விளக்கி நடைமுறைத் தீர்வைக் காட்டுங்கள். குறிப்பான விவரங்களையும் தெளிவான எடுத்துக்காட்டையும் பயன்படுத்துங்கள்.","சிறிய கவனமான ஒரு படி அடுத்த நிகழ்வை மாற்றலாம். நினைவில் நிற்கும் கருத்துடன் இதை இணைக்கவும்.","முக்கியம் எளிது: தேவையைப் புரிந்து, பயனுள்ள அடுத்த படியைத் தேர்ந்து, மனிதக் கதையை மையமாக வையுங்கள்.","அடுத்து நீங்கள் என்ன உருவாக்கப் போகிறீர்கள்? பார்த்ததற்கு நன்றி.",["சம்பந்தப்பட்டவர்களை நெருக்கமாகப் பாருங்கள். முதலில் அவர்கள் என்ன கவனித்தார்கள்? எது தெளிவாக இல்லை? அவர்கள் முடிவெடுக்க எந்தத் தகவல் உதவியது?","அடுத்த பகுதியை குறிப்பாகக் காட்டுங்கள். நடைமுறை எடுத்துக்காட்டையும் ஏற்பட்ட மாற்றத்தையும் நேர்மையாக விளக்குங்கள்.","கதைக்கு உயிர் தரும் மனித விவரத்தில் சிறிது தங்குங்கள். ஒரு சிறிய முடிவு, எதிர்பாராத தடையாகவோ பயனுள்ள உரையாடலாகவோ இருக்கலாம்."],"இது நடைமுறையில் எப்படி இருக்கும்? விவரங்களைக் கவனித்து தெளிவான தேர்வு செய்வதில் தொடங்குகிறது."] ,Spanish:["Esta es una historia que merece explorarse.","Empieza con una pregunta cercana al público. ¿Qué está cambiando y por qué importa a las personas de esta historia?","Muestra un momento humano concreto. Describe el lugar, presenta a las personas y aclara la idea central.","Explica el reto y muestra una respuesta práctica. Usa detalles concretos, un ejemplo claro y transiciones naturales.","Un pequeño paso consciente puede cambiar lo que sucede después. Conecta la idea con una reflexión memorable.","La idea clave es sencilla: entiende la necesidad, elige un siguiente paso útil y mantén la historia humana en el centro.","¿Qué crearás ahora? Gracias por acompañarnos.",["Observa de cerca a las personas. ¿Qué notaron primero? ¿Qué seguía siendo incierto? ¿Qué información les ayudó a elegir? Conecta ese momento con la idea principal.","Haz concreta la siguiente parte. Presenta un ejemplo práctico, explica el cambio y nombra las decisiones con honestidad.","Detente en un detalle humano que dé textura a la historia. Incluye una decisión pequeña, un obstáculo inesperado o una conversación útil."],"¿Cómo se ve esto en la práctica? Empieza por observar los detalles y tomar una decisión clara."] ,French:["Voici une histoire qui mérite d’être explorée.","Commencez par une question familière. Qu’est-ce qui change et pourquoi cela compte-t-il pour les personnes de cette histoire ?","Montrez un moment humain précis. Décrivez le lieu, présentez les personnes et clarifiez l’idée centrale.","Expliquez le défi et montrez une réponse pratique. Utilisez des détails concrets, un exemple clair et des transitions naturelles.","Un petit geste réfléchi peut changer la suite. Reliez cette idée à un enseignement mémorable.","L’essentiel est simple : comprendre le besoin, choisir une prochaine étape utile et garder l’histoire humaine au cœur du récit.","Que créerez-vous ensuite ? Merci d’avoir regardé.",["Observez les personnes de près. Qu’ont-elles remarqué en premier ? Qu’est-ce qui restait incertain ? Quelles informations les ont aidées à choisir ? Reliez ce moment à l’idée générale.","Rendez la scène suivante concrète. Présentez un exemple pratique, expliquez le changement et nommez honnêtement les compromis.","Arrêtez-vous sur un détail humain qui donne du relief au récit. Incluez une petite décision, un obstacle inattendu ou une conversation utile."],"À quoi cela ressemble-t-il concrètement ? Tout commence en observant les détails et en faisant un choix clair."] ,Japanese:["掘り下げる価値のある物語です。","視聴者になじみのある問いから始めましょう。何が変わりつつあり、物語の人々にとってなぜ大切なのでしょうか。","具体的な人の瞬間を見せましょう。場所を描き、人々を紹介し、中心となる考えを明確にします。","課題を説明し、実用的な対応を示しましょう。具体的な詳細とわかりやすい例を自然につなげます。","小さくても思慮深い一歩が、その後を変えることがあります。覚えやすい気づきに結びつけます。","要点はシンプルです。必要なことを理解し、有用な次の一歩を選び、人の物語を中心に置きます。","次は何を作りますか。ご覧いただきありがとうございました。",["登場する人々をよく見てください。最初に気づいたことは何でしょう。何が不確かで、どんな情報が選択を助けましたか。その瞬間を大きなテーマにつなげます。","次の場面を具体的にしましょう。実例を示し、変化を説明し、選択の利点と課題を正直に伝えます。","物語に深みを与える人間らしい細部に目を向けます。小さな決断、予想外の障害、役立つ会話を入れましょう。"],"実際にはどのような姿でしょうか。細部に気づき、明確な選択をすることから始まります。"] ,Arabic:["هذه قصة تستحق الاستكشاف.","ابدأ بسؤال يعرفه المشاهدون. ما الذي يتغير، ولماذا يهم ذلك الأشخاص في هذه القصة؟","اعرض لحظة إنسانية محددة. صِف المكان، وقدّم الأشخاص، ووضّح الفكرة الأساسية.","اشرح التحدي واعرض استجابة عملية. استخدم تفاصيل واضحة ومثالاً محدداً وانتقالات طبيعية.","قد تغيّر خطوة صغيرة ومدروسة ما يحدث لاحقاً. اربط الفكرة بخلاصة يسهل تذكرها.","الخلاصة بسيطة: افهم الحاجة، واختر خطوة تالية مفيدة، واجعل القصة الإنسانية في قلب العمل.","ما الذي ستبدعه بعد ذلك؟ شكراً للمشاهدة.",["تأمل الأشخاص عن قرب. ما أول ما لاحظوه؟ ما الذي ظل غير واضح؟ وما المعلومات التي ساعدتهم على الاختيار؟ اربط تلك اللحظة بالفكرة الأوسع.","اجعل المشهد التالي ملموساً. قدّم مثالاً عملياً، واشرح ما تغيّر، واذكر المفاضلات بصدق.","توقف عند تفصيل إنساني يمنح القصة عمقاً. أضف قراراً صغيراً أو عقبة غير متوقعة أو حواراً مفيداً."],"كيف يبدو ذلك عملياً؟ يبدأ بملاحظة التفاصيل واتخاذ خيار واضح."]};return packs[language]||packs.English}
function generateScript(){
 if(!state.brief?.approved){say('Approve the creative brief before generating a script.',true);return}
 const format=document.querySelector('#scriptFormat')?.value||state.scriptFormat||'narration';state.scriptFormat=format;
 const minutes=Number(state.settings.durationMinutes)||1,localized=localizedScript(state.settings.language),label=format==='dialogue'?'[HOST]':'[NARRATOR]',guest=format==='dialogue'?'[GUEST]':label;
 const ref=state.referenceText?` Reference context: ${state.referenceText}.`:state.reference?` Reference context: ${state.reference}.`:'';
 const topic=state.idea||state.brief.title,close=`[CLOSE — ${minutes}:00]\n${label} ${localized[6]}`;
 const blocks=[`[OPEN — 0:00]\n${label} ${localized[0]} ${state.brief.title}: ${topic}.${ref}`,`[SETUP]\n${label} ${localized[1]}`,`[STORY]\n${guest} ${localized[2]} ${state.settings.visualStyle} imagery can support this beat without distracting from the story.`,`[DEVELOPMENT]\n${label} ${localized[3]}`,`[TURNING POINT]\n${guest} ${localized[4]}`,`[TAKEAWAY]\n${label} ${localized[5]}`];
 if(format==='mixed')blocks.splice(3,0,`[DIALOGUE]\n[HOST] ${localized[8]}`);
 blocks.push(close);const expansions=localized[7],targetWords=minutes*125;let cursor=0;
 while(wordCountPreview(blocks.join('\n\n'))<targetWords&&cursor<24){blocks.splice(blocks.length-1,0,`[DETAIL ${cursor+1}]\n${cursor%2?guest:label} ${expansions[cursor%expansions.length]}`);cursor++}
 if(state.script&&state.scriptSavedText&&state.script!==state.scriptSavedText)state.scriptVersions=appendVersionPreview(state.scriptVersions,state.script,'edited');
 state.script=blocks.join('\n\n');state.scriptSavedText=state.script;state.scriptVersions=appendVersionPreview(state.scriptVersions,state.script,'generated');state.scriptApproved=false;resetAfterScript();state.scriptUsage=state.scriptUsage||[];
 state.scriptUsage.push({provider:'Simulated',inputTokens:Math.ceil((state.idea.length+state.reference.length+state.referenceText.length)/4),outputTokens:Math.ceil(state.script.length/4),estimatedCostMyr:0,createdAt:new Date().toISOString()});
 say(`Simulated ${format} script generated in ${state.settings.language} for ${minutes} minute(s). Estimated API cost: RM0. Edit and save, then approve.`);setStep(2)
}
function appendVersionPreview(list,text,reason){if(!text?.trim())return list||[];const next=[...(list||[]),{id:'v'+((list||[]).length+1),text:text.trim(),createdAt:new Date().toISOString(),reason}];return next.slice(-50)}
function saveScript(){const next=document.querySelector('#scriptReview')?.value??document.querySelector('#script')?.value??state.script;if(!next.trim()){say('The script cannot be empty.',true);return}const changed=next!==state.scriptSavedText;if(changed){state.scriptVersions=appendVersionPreview(state.scriptVersions,next,'edited');state.script=next;state.scriptSavedText=next;state.scriptApproved=false;resetAfterScript()}say(changed?'Script edits saved as a new version. Approval was reset and dependent scenes were cleared.':'Script edits saved.');draw()}
function restoreScriptVersion(index){const version=state.scriptVersions?.[index];if(!version)return;if(state.script&&state.script!==state.scriptSavedText)state.scriptVersions=appendVersionPreview(state.scriptVersions,state.script,'edited');state.script=version.text;state.scriptSavedText=version.text;state.scriptVersions=appendVersionPreview(state.scriptVersions,state.script,'restored');state.scriptApproved=false;resetAfterScript();say('Version restored. Script approval and dependent work were reset.');draw()}
async function approveScript(){const next=document.querySelector('#scriptReview')?.value??document.querySelector('#script')?.value??state.script;if(!next.trim()){say('The script cannot be empty.',true);return}if(next!==state.scriptSavedText){state.scriptVersions=appendVersionPreview(state.scriptVersions,next,'edited');state.script=next;state.scriptSavedText=next;resetAfterScript()}state.scriptApproved=false;try{if(!browserStorage)await requestServerApproval('script');state.scriptApproved=true;scheduleAutosave();say('Script approved. Scene breakdown is unlocked.')}catch(error){state.scriptApproved=false;scheduleAutosave();say(error instanceof Error?error.message:'Could not approve the script on the server.',true)}draw()}
function cleanSceneBase(value){return String(value||'').replace(/\n\n\[CCAI CONTINUITY\][\s\S]*?\[\/CCAI CONTINUITY\]/g,'').replace(/\s+(?:Brand direction|Character continuity|Location continuity):[\s\S]*$/,'').trim()}function refreshScenePrompt(scene,index){const base=cleanSceneBase(scene.basePrompt||scene.prompt);scene.basePrompt=base;const lines=[];const brand=entityRecord('brandKits',state.brandKitId);if(brand)lines.push(`Brand direction: ${brand.visualGuidelines||''} ${brand.colors||''} ${brand.typography||''}.`);const cast=(scene.characterIds||[]).map(id=>entityRecord('characters',id)).filter(Boolean);if(cast.length)lines.push(`Character continuity: ${cast.map(c=>`${c.name} (${c.appearance||'match reference images'}; ${c.distinguishingFeatures||'keep distinguishing details consistent'}; reference images: ${(c.referenceImages||[]).map(img=>img.name).join(', ')||'none'}; ${state.appearanceOverrides?.[c.id]||c.clothing||''}; scene outfit: ${scene.outfitOverride||'project default'}).`).join(' ')}`);const place=entityRecord('locations',scene.locationId);if(place)lines.push(`Location continuity: ${place.name} (${place.description||place.environment||''}; ${place.lighting||''}; ${place.visualStyle||''}; reference images: ${(place.referenceImages||[]).map(img=>img.name).join(', ')||'none'}).`);scene.prompt=base+(lines.length?`\n\n[CCAI CONTINUITY]\n${lines.join('\n')}\n[/CCAI CONTINUITY]`:'')}function refreshProjectSceneContinuity(){let changed=false;(state.scenes||[]).forEach((scene,index)=>{const prior=scene.prompt||'';refreshScenePrompt(scene,index);if(scene.prompt!==prior){invalidateSceneVisual(index);changed=true}});if(changed)scheduleAutosave();return changed}
function sceneId(){return crypto.randomUUID?crypto.randomUUID():'scene-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function normalizeScenePreview(scene,index){const approved=Boolean(scene.approved||scene.approvalStatus==='approved');return{...scene,id:scene.id||'legacy-scene-'+index,title:scene.title||`Scene ${index+1}`,line:scene.line||'',seconds:Number(scene.seconds)||4,prompt:scene.prompt||'',basePrompt:scene.basePrompt||'',characterIds:Array.isArray(scene.characterIds)?scene.characterIds:[],locationId:scene.locationId||'',outfitOverride:scene.outfitOverride||'',approved,approvalStatus:scene.approvalStatus||(approved?'approved':scene.rejected?'rejected':'pending'),reviewDecision:scene.reviewDecision||null,generationStatus:scene.generationStatus||(scene.image?'completed':'pending'),generationError:scene.generationError||'',needsGeneration:Boolean(scene.needsGeneration),imageData:scene.imageData||(typeof scene.image==='string'?scene.image:''),imageProvider:scene.imageProvider||'simulated',imageVersions:Array.isArray(scene.imageVersions)?scene.imageVersions:[],imagePromptUsed:scene.imagePromptUsed||'',scriptTextUsed:scene.scriptTextUsed||'',version:Number(scene.version)||0}}
function normalizeImageWorkflowState(){state.scenes=(state.scenes||[]).map(normalizeScenePreview);state.imageJobs=(state.imageJobs||[]).map(job=>job.status==='generating'?{...job,status:'pending',progress:0}:job);state.imageJobs.forEach(job=>{const scene=state.scenes.find(item=>item.id===job.sceneId);if(scene&&scene.generationStatus==='generating')scene.generationStatus='pending'});state.imageUsage=state.imageUsage||{generatedCount:0,regenerationCount:0,estimatedCostMyr:0,actualCostMyr:0};state.imageSpendingLimitMyr=Number(state.imageSpendingLimitMyr)||0;state.pendingImageRequest=null;state.imageCropDraft=null}
function sceneBeatText(script,count){const clean=String(script||'').replace(/^\[[^\]]+\]\s*/gm,'').replace(/\[(?:NARRATOR|HOST|GUEST|CLOSE|OPEN|STORY|SETUP|DEVELOPMENT|TAKEAWAY|TURNING POINT|DIALOGUE)[^\]]*\]/gi,' ');const locale={English:'en',Malay:'ms',Chinese:'zh',Tamil:'ta',Spanish:'es',French:'fr',Japanese:'ja',Arabic:'ar'}[state.settings.language]||'en';const tokens=typeof Intl.Segmenter==='function'?Array.from(new Intl.Segmenter(locale,{granularity:'word'}).segment(clean)).filter(part=>part.isWordLike).map(part=>part.segment):(clean.match(/[\p{L}\p{N}]+(?:['’][\p{L}\p{N}]+)*/gu)||[]);const chunk=Math.max(1,Math.ceil(tokens.length/count));return Array.from({length:count},(_,i)=>tokens.slice(i*chunk,(i+1)*chunk).join(' ')||`Visual beat ${i+1}`)}
function defaultScenePrompt(line){const cast=(state.characterIds||[]).map(id=>entityRecord('characters',id)?.name).filter(Boolean).join(', ');const place=(state.locationIds||[]).map(id=>entityRecord('locations',id)?.name).filter(Boolean).join(', ');return `Create a ${state.settings.visualStyle} ${state.settings.aspectRatio} frame showing ${line}. ${cast?`Keep these characters visually consistent: ${cast}.`:''} ${place?`Use the assigned location: ${place}.`:''} Follow project brand direction and continue the story chronologically.`.trim()}
function createScene(line,index){return{id:sceneId(),title:`Scene ${index+1}: ${line.split(/\s+/).slice(0,6).join(' ')}`,line,seconds:4,prompt:defaultScenePrompt(line),basePrompt:'',characterIds:[...(state.characterIds||[])],locationId:state.locationIds?.[0]||'',outfitOverride:'',approved:false,approvalStatus:'pending',reviewDecision:null,image:false,imageData:'',imageVersions:[],imagePromptUsed:'',scriptTextUsed:'',version:0,generationStatus:'pending',generationError:'',needsGeneration:false}}

function makeScenes(){if(!state.scriptApproved||!state.script.trim()){say('Approve a non-empty script before creating scenes.',true);return}if(state.scenes.some(s=>s.image)&&!confirm('Replacing this scene breakdown will remove its current scene images and approvals. Continue?'))return;const count=Math.min(100,Math.max(1,Math.ceil(Number(state.settings.durationMinutes||1)*60/4)));const beats=sceneBeatText(state.script,count);state.scenes=beats.map((line,index)=>createScene(line,index));state.imageJobs=[];state.voice=false;state.render=false;state.post=false;state.thumb=false;state.exported=false;scheduleAutosave();say(`Created ${count} chronological scene beats at about 4 seconds each. Edit the scenes, then save before image generation.`);draw()}

function captureSceneEdits(){let changed=0;for(let i=0;i<state.scenes.length;i++){if(!document.querySelector('#sceneTitle'+i))continue;const scene=state.scenes[i];const title=document.querySelector('#sceneTitle'+i)?.value.trim();const line=document.querySelector('#sceneText'+i)?.value.trim();const prompt=document.querySelector('#scenePrompt'+i)?.value.trim();const seconds=Number(document.querySelector('#sceneSeconds'+i)?.value);const outfit=document.querySelector('#sceneOutfit'+i)?.value.trim()||'';const locationId=document.querySelector('#sceneLocation'+i)?.value||'';const chars=[...view.querySelectorAll(`[data-image-scene-characters="${i}"]:checked`)].map(el=>el.value);if(title&&title!==scene.title)scene.title=title;if(Number.isFinite(seconds)&&seconds>=1&&seconds<=120)scene.seconds=seconds;const assignmentChanged=locationId!==scene.locationId||outfit!==scene.outfitOverride||JSON.stringify(chars)!==JSON.stringify(scene.characterIds||[]);const lineChanged=line!==undefined&&line!==scene.line;const inputChanged=lineChanged||(prompt!==undefined&&prompt!==scene.prompt)||assignmentChanged;if(lineChanged)scene.line=line;if(prompt!==undefined&&prompt!==scene.prompt){scene.prompt=prompt;scene.basePrompt=cleanSceneBase(prompt)}scene.outfitOverride=outfit;scene.locationId=locationId;scene.characterIds=chars;if(inputChanged){if(lineChanged)(scene.voiceSegments||[]).forEach(segment=>invalidateVoiceSegment(scene,segment));state.imageJobs.filter(job=>job.sceneId===scene.id&&job.status==='pending').forEach(job=>{job.status='cancelled';job.error='Cancelled because scene inputs changed.'});invalidateSceneForInputs(scene);if(assignmentChanged)refreshScenePrompt(scene,i);changed++}}if(changed){say(`${changed} scene input${changed===1?'':'s'} saved. Existing images were preserved; no generation started.`);scheduleAutosave()}return changed}
function createSimulatedImage(scene,index,uniqueId=sceneId()){const size=state.settings.aspectRatio==='9:16'?{w:1080,h:1920}:{w:1920,h:1080};const canvas=document.createElement('canvas');canvas.width=size.w;canvas.height=size.h;const ctx=canvas.getContext('2d');if(!ctx)throw new Error('The browser cannot create a local simulated image.');const gradient=ctx.createLinearGradient(0,0,size.w,size.h);gradient.addColorStop(0,'#13211b');gradient.addColorStop(1,'#647543');ctx.fillStyle=gradient;ctx.fillRect(0,0,size.w,size.h);ctx.fillStyle='rgba(226,192,121,.65)';ctx.beginPath();ctx.arc(size.w*.75,size.h*.22,size.w*.18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#24372b';ctx.beginPath();ctx.moveTo(0,size.h*.78);ctx.quadraticCurveTo(size.w*.5,size.h*.48,size.w,size.h*.78);ctx.lineTo(size.w,size.h);ctx.lineTo(0,size.h);ctx.closePath();ctx.fill();ctx.fillStyle='#d2ed96';ctx.font=`700 ${Math.round(size.w/22)}px sans-serif`;ctx.textBaseline='top';ctx.fillText(`SIMULATED IMAGE · SCENE ${index+1}`,size.w*.08,size.h*.08,size.w*.84);const words=String(scene.line||scene.title||'Scene').slice(0,120).split(/\s+/);const lines=[];let line='';ctx.font=`700 ${Math.round(size.w/28)}px sans-serif`;for(const word of words){const next=line?line+' '+word:word;if(ctx.measureText(next).width>size.w*.82&&line){lines.push(line);line=word}else line=next}if(line)lines.push(line);ctx.fillStyle='#f4f3e8';const lineHeight=Math.round(size.w/22);lines.slice(0,5).forEach((item,i)=>ctx.fillText(item,size.w*.08,size.h*.42+i*lineHeight,size.w*.84));ctx.fillStyle='#c7ef7a';ctx.font=`500 ${Math.round(size.w/48)}px sans-serif`;ctx.fillText(`Preview ID · ${String(uniqueId).slice(0,8)}`,size.w*.08,size.h*.92,size.w*.84);return canvas.toDataURL('image/jpeg',.78)}
function sceneImageStatus(scene){if(scene.generationStatus==='generating')return'Generating';if(scene.generationStatus==='failed')return'Failed';if(scene.generationStatus==='cancelled')return'Cancelled';if(scene.approved)return'Approved';if(scene.approvalStatus==='rejected')return'Rejected';if(scene.image)return'Pending Review';return'Pending'}

function imageQueueView(){const rows=(state.imageJobs||[]).slice(-50).map(job=>{const scene=state.scenes.find(s=>s.id===job.sceneId);return `<div class="queue-row"><div><strong>${escapeHtml(scene?.title||'Removed scene')}</strong><small>${escapeHtml(job.kind)} · ${escapeHtml(job.status)} · ${Number(job.progress||0)}%</small>${job.error?`<small class="warn-text">${escapeHtml(job.error)}</small>`:''}</div>${job.status==='pending'?button('Cancel job','cancelImageJob(\''+job.id+'\')','secondary'):''}</div>`}).join('');const progress=queueProgress();return `<section class="panel"><div class="row"><div><h2>Generation queue</h2><p class="sub">Pending, generating, completed, failed and cancelled jobs are saved with this project.</p></div><div class="queue-stat"><strong>${progress.percent}%</strong><span>${progress.active.length} active · ${progress.done.length} finished</span></div></div><div class="progress"><i style="width:${progress.percent}%"></i></div>${rows||'<div class="empty">No image jobs yet.</div>'}<div class="help">If the page closed during generation, interrupted jobs return to Pending. Click Resume to restart them; nothing starts automatically on project open.</div>${progress.active.some(job=>job.status==='pending')?button('Resume pending jobs','runImageQueue()','secondary'):''}</section>`}

function updateCropPreview(){const draft=state.imageCropDraft,canvas=document.querySelector('#imageCropPreview');if(!draft||!canvas)return;const image=new Image();image.onload=()=>{const ratio=state.settings.aspectRatio==='9:16'?9/16:16/9,w=ratio<1?270:480,h=ratio<1?480:270;canvas.width=w;canvas.height=h;let sw=image.width,sh=image.height;if(image.width/image.height>ratio)sw=image.height*ratio;else sh=image.width/ratio;const sx=(image.width-sw)*draft.focusX/100,sy=(image.height-sh)*draft.focusY/100;canvas.getContext('2d')?.drawImage(image,sx,sy,sw,sh,0,0,w,h)};image.src=draft.dataUrl}
function applyImageCrop(){const draft=state.imageCropDraft,index=state.scenes.findIndex(scene=>scene.id===draft?.sceneId),scene=state.scenes[index];if(!draft||!scene)return;const image=new Image();image.onload=()=>{const size=state.settings.aspectRatio==='9:16'?{w:1080,h:1920}:{w:1920,h:1080},ratio=size.w/size.h;let sw=image.width,sh=image.height;if(image.width/image.height>ratio)sw=image.height*ratio;else sh=image.width/ratio;const sx=(image.width-sw)*draft.focusX/100,sy=(image.height-sh)*draft.focusY/100,canvas=document.createElement('canvas');canvas.width=size.w;canvas.height=size.h;const ctx=canvas.getContext('2d');if(!ctx){say('Image crop is unavailable in this browser.',true);return}ctx.drawImage(image,sx,sy,sw,sh,0,0,size.w,size.h);const data=canvas.toDataURL('image/jpeg',.76);if(data.length>3_200_000){say('Cropped image exceeds preview storage limits. Choose a smaller image.',true);return}scene.version++;scene.imageData='';scene.image=true;scene.imageProvider='uploaded';scene.imageVersions=[...(scene.imageVersions||[]),{image:data,prompt:scene.prompt,scriptText:scene.line,aspectRatio:state.settings.aspectRatio,createdAt:new Date().toISOString(),provider:'uploaded',version:scene.version}];scene.imagePromptUsed=scene.prompt;scene.scriptTextUsed=scene.line;scene.needsGeneration=false;scene.generationStatus='completed';scene.generationError='';scene.approved=false;scene.approvalStatus='pending';scene.reviewDecision=null;state.imageCropDraft=null;state.voice=false;state.render=false;state.post=false;state.thumb=false;state.exported=false;scheduleAutosave();say(`Image cropped to ${size.w} × ${size.h} without distortion. Approval reset for this scene.`);draw()};image.onerror=()=>say('Could not crop this image.',true);image.src=draft.dataUrl}
function handleSceneImageUpload(input){const index=Number(input.dataset.sceneImageUpload),scene=state.scenes[index],file=input.files?.[0];if(!scene||!file)return;captureSceneEdits();if(scene.approved){say('Unlock the approved scene before replacing its image.',true);return}if(file.size>20*1024*1024||!/^image\/(png|jpeg|webp)$/.test(file.type)){say('Choose a PNG, JPEG, or WebP under 20 MB.',true);return}const reader=new FileReader();reader.onerror=()=>say('Could not read the selected image.',true);reader.onload=()=>{state.imageCropDraft={sceneId:scene.id,dataUrl:reader.result,focusX:50,focusY:50};draw();updateCropPreview()};reader.readAsDataURL(file);input.value=''}
function confirmImageGeneration(){const request=state.pendingImageRequest;if(!request)return;queueImageScenes(request.indices,request.kind);state.pendingImageRequest=null;draw()}
function queueImageScenes(indices,kind='initial'){const queued=[];for(const index of indices){const scene=state.scenes[index];if(!scene||scene.approved||!scene.prompt.trim())continue;if(state.imageJobs.some(job=>job.sceneId===scene.id&&['pending','generating'].includes(job.status)))continue;if(kind==='initial'&&scene.image&&!scene.needsGeneration)continue;queued.push({id:sceneId(),sceneId:scene.id,status:'pending',progress:0,kind:kind==='initial'&&scene.image?'regeneration':kind,prompt:scene.prompt,scriptText:scene.line,createdAt:new Date().toISOString()})}if(!queued.length){say('No eligible scenes were queued. Approved and running images remain unchanged.',true);return}state.imageJobs.push(...queued);queued.forEach(job=>{const scene=state.scenes.find(item=>item.id===job.sceneId);if(scene){scene.generationStatus='pending';scene.generationError=''}});state.pendingImageRequest=null;scheduleAutosave();say(`${queued.length} image generation job${queued.length===1?'':'s'} queued. Simulated cost RM0.`);draw();setTimeout(runImageQueue,900)}
async function runImageQueue(){if(imageQueueProcessing)return;imageQueueProcessing=true;try{while(true){const job=state.imageJobs.find(item=>item.status==='pending');if(!job)break;job.status='generating';job.progress=10;const scene=state.scenes.find(item=>item.id===job.sceneId);if(!scene){job.status='failed';job.error='Scene no longer exists.';continue}scene.generationStatus='generating';draw();scheduleAutosave();await new Promise(resolve=>setTimeout(resolve,350));job.progress=55;draw();await new Promise(resolve=>setTimeout(resolve,350));if(job.prompt.includes('[simulate-failure]')){job.status='failed';job.progress=100;job.error='Simulated failure. Remove [simulate-failure] from the saved prompt and retry this scene.';scene.generationStatus='failed';scene.generationError=job.error;scheduleAutosave();draw();continue}const image=createSimulatedImage(scene,state.scenes.indexOf(scene),job.id);scene.version++;scene.imageData='';scene.image=true;scene.imageProvider='simulated';scene.imageVersions=[...(scene.imageVersions||[]),{image,prompt:job.prompt,scriptText:job.scriptText,aspectRatio:state.settings.aspectRatio,createdAt:new Date().toISOString(),provider:'simulated',version:scene.version}];scene.imagePromptUsed=job.prompt;scene.scriptTextUsed=job.scriptText;scene.needsGeneration=false;scene.generationStatus='completed';scene.generationError='';scene.approvalStatus='pending';scene.reviewDecision=null;scene.approved=false;job.status='completed';job.progress=100;state.imageUsage=state.imageUsage||{generatedCount:0,regenerationCount:0,estimatedCostMyr:0,actualCostMyr:0};if(job.kind==='initial')state.imageUsage.generatedCount++;else state.imageUsage.regenerationCount++;state.imageUsage.estimatedCostMyr=Number(state.imageUsage.estimatedCostMyr||0);state.imageUsage.actualCostMyr=Number(state.imageUsage.actualCostMyr||0);scheduleAutosave();draw()} }finally{imageQueueProcessing=false;draw();scheduleAutosave()}}
async function confirmReviewDecisions(){captureSceneEdits();const rejected=[],toApprove=[];for(let index=0;index<state.scenes.length;index++){const scene=state.scenes[index];if(scene.approved)continue;if(scene.reviewDecision==='approve'){scene.reviewDecision=null;scene.needsGeneration=false;toApprove.push({scene,index})}else if(scene.reviewDecision==='reject'){scene.approved=false;scene.approvalStatus='rejected';scene.reviewDecision=null;rejected.push(index)}}let failed=0,ready=browserStorage;if(!browserStorage&&toApprove.length){try{await saveDraftBeforeApproval();ready=true}catch(error){failed=toApprove.length;say(error instanceof Error?error.message:'Could not save scenes before approval.',true)}}for(const {scene} of toApprove){scene.approved=false;scene.approvalStatus='pending';try{if(!browserStorage){if(!ready)throw new Error('Scenes were not saved before approval.');await requestServerApproval('image',scene.id,true)}scene.approved=true;scene.approvalStatus='approved'}catch(error){failed++;scene.approved=false;scene.approvalStatus='pending';scene.needsGeneration=false;say(error instanceof Error?error.message:'Server rejected the image approval.',true)}}state.voice=voiceIsComplete();scheduleAutosave();if(rejected.length){say(`Confirmed review. Only ${rejected.length} rejected scene${rejected.length===1?'':'s'} are queued for regeneration.`);queueImageScenes(rejected,'regeneration');return}say(failed?`${failed} image approval(s) were not accepted by the server.`:'Review decisions confirmed. Nothing was regenerated.',failed>0);draw()}
function setReviewDecision(index,decision){captureSceneEdits();const scene=state.scenes[index];if(!scene||scene.approved||!scene.image){say('Generate an image before setting a review decision.',true);return}scene.reviewDecision=decision;scheduleAutosave();draw()}
function setAllReviewDecisions(decision){captureSceneEdits();for(const scene of state.scenes)if(!scene.approved&&scene.image)scene.reviewDecision=decision;say(decision==='approve'?'Approve All is ready to confirm.':'Reject All is ready to confirm. No image generation started.');draw()}
function restoreImageVersion(index,versionIndex){const scene=state.scenes[index],version=scene?.imageVersions?.[versionIndex];if(!scene||!version||scene.approved)return;scene.imageData='';scene.image=true;scene.imageProvider=version.provider||'restored';scene.version++;scene.imageVersions.push({image:version.image,prompt:version.prompt,scriptText:version.scriptText,aspectRatio:version.aspectRatio,createdAt:new Date().toISOString(),provider:'restored',version:scene.version,restoredFrom:version.version});scene.imagePromptUsed=version.prompt;scene.approvalStatus='pending';scene.reviewDecision=null;scene.approved=false;scene.needsGeneration=false;scene.generationStatus='completed';state.voice=false;state.render=false;state.post=false;state.thumb=false;state.exported=false;scheduleAutosave();say('Previous image restored; approval reset for this scene.');draw()}
function unlockScene(index){const scene=state.scenes[index];if(!scene?.approved||!confirm('Unlock this approved scene for edits? Its current image remains saved.'))return;scene.approved=false;scene.approvalStatus='pending';scene.reviewDecision=null;scene.needsGeneration=true;state.voice=false;state.render=false;state.post=false;state.thumb=false;state.exported=false;scheduleAutosave();draw()}
function getVoiceProfile(id){return(libraryData.voices||[]).find(profile=>profile.id===id)}
function voiceIsComplete(scenes=state.scenes){return Array.isArray(scenes)&&scenes.length>0&&scenes.every(scene=>scene.approved&&Boolean(scene.image)&&Array.isArray(scene.voiceSegments)&&scene.voiceSegments.length>0&&scene.voiceSegments.every(segment=>segment.approved&&!segment.needsGeneration&&segment.status==='completed'&&voiceAudioUrl(segment)&&Number(segment.durationSeconds)>0))}

function voiceWordCount(text){const cleaned=String(text||'').trim();if(!cleaned)return 0;if(typeof Intl.Segmenter==='function')return Array.from(new Intl.Segmenter(state.settings.language||'en',{granularity:'word'}).segment(cleaned)).filter(x=>x.isWordLike).length;return(cleaned.match(/[\p{L}\p{N}]+/gu)||[]).length}
function estimateVoiceSeconds(text,speed=1){const count=voiceWordCount(text);return count?Math.max(.5,Number((count/(150*speed)*60).toFixed(2))):0}
function simulatedWav(text,speed,id){const seconds=Math.min(60,Math.max(.5,estimateVoiceSeconds(text,speed)||.5)),rate=4000,samples=Math.floor(seconds*rate),bytes=new Uint8Array(44+samples),view=new DataView(bytes.buffer);const write=(offset,str)=>{for(let n=0;n<str.length;n++)bytes[offset+n]=str.charCodeAt(n)};write(0,'RIFF');view.setUint32(4,36+samples,true);write(8,'WAVE');write(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,rate,true);view.setUint32(28,rate,true);view.setUint16(32,1,true);view.setUint16(34,8,true);write(36,'data');view.setUint32(40,samples,true);const frequency=300+[...String(id)].reduce((sum,c)=>sum+c.charCodeAt(0),0)%260;for(let i=0;i<samples;i++){const fade=Math.min(1,i/80,(samples-i)/80);bytes[44+i]=Math.max(0,Math.min(255,Math.round(128+Math.sin(i/rate*Math.PI*2*frequency)*10*fade)))}let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));return{dataUrl:'data:audio/wav;base64,'+btoa(binary),durationSeconds:seconds}}

ek</span></div><div><strong>13</strong><span>Production stages</span></div></div>${creatingProject?`<section class="panel create-project"><h2>Create a project</h2><p class="sub">Start with a project name. You can set duration, format, references, and creative direction in the workspace.</p><label class="field" for="newProjectTitle">Project name<input id="newProjectTitle" maxlength="120" placeholder="e.g. Spring brand story"></label><div class="actions"><button class="primary" onclick="createProjectAction()">Create project</button><button class="secondary" onclick="creatingProject=false;draw()">Cancel</button></div></section>`:''}<div class="projects-grid">${cards||`<div class="empty dashboard-empty"><strong>No projects yet</strong><br>Create a video project to open the production workspace.</div>`}</div><p class="help storage-note">${browserStorage?'Project details and workflow progress are stored in browser-local storage on this device.':'Project details and workflow progress are saved in SQLite on this app server.'} AI output remains simulated.</p>`}
function loadBrowserProjects(){try{const value=JSON.parse(localStorage.getItem(BROWSER_PROJECTS_KEY)||'[]');return Array.isArray(value)?value:[]}catch{return[]}}

function projectPayload(){const {projectId,projectTitle,dashboard,imageCropDraft,pendingImageRequest,serverApprovals,...payload}=state;return payload}

function makeProjectId(){return crypto.randomUUID?crypto.randomUUID():'ccai-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9)}
async function refreshProjectList(){if(browserStorage){projectList=loadBrowserProjects().map(localProjectSummary);setStorageMode(true);return true}try{const response=await fetch('/api/projects',{credentials:'same-origin'});const result=await response.json();if(response.status===401){authExpired();return false}if(!response.ok)throw new Error(result.error||'Could not load projects');projectList=result.projects.map(p=>({...p,stage:stageSummary({step:p.step}),status:p.status,priority:p.priority,seriesId:p.seriesId,channelId:p.channelId,brandKitId:p.brandKitId}));setStorageMode(false);return true}catch(error){say(error instanceof Error?error.message:'Could not load server projects.',true);return false}}
async function saveProjectRecord(id,title,payload){if(browserStorage){const record=loadBrowserProjects().find(item=>item.id===id);if(record){record.title=title;record.payload=payload;record.updatedAt=new Date().toISOString();storeBrowserProject(record);notice.textContent='Saved in this browser';notice.className='notice'}return}try{const response=await fetch('/api/projects/'+encodeURIComponent(id),{method:'PATCH',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({title,payload})});const result=await response.json();if(response.status===401){authExpired();throw new Error('Sign in again to save server changes.')}if(!response.ok)throw new Error(result.error||'Autosave failed');const item=projectList.find(p=>p.id===id);if(item)item.updatedAt=result.project.updatedAt;notice.textContent='All changes saved';notice.className='notice'}catch(error){say(error instanceof Error?error.message:'Server save failed. Reconnect before continuing.',true)}}

async function createProjectAction(){const title=document.querySelector('#newProjectTitle')?.value.trim();if(!title){say('Enter a project name to continue.',true);return}const draft=initialState(title);draft.dashboard=false;draft.priority=3;draft.projectStatus='Draft';draft.channelId=document.querySelector('#newProjectChannel')?.value||'';const profile=entityRecord('channels',draft.channelId);if(profile){draft.settings.language=profile.language||draft.settings.language;draft.settings.durationMinutes=Number(profile.durationMinutes||draft.settings.durationMinutes);draft.settings.aspectRatio=profile.aspectRatio||draft.settings.aspectRatio;draft.settings.visualStyle=profile.visualStyle||draft.settings.visualStyle;draft.appliedChannelProfile={targetAudience:profile.targetAudience||'',contentCategory:profile.contentCategory||'',storytellingPreferences:profile.storytellingPreferences||''}}const payload=(()=>{const {projectId,projectTitle,dashboard,...rest}=draft;return rest})();if(browserStorage){const id=makeProjectId();storeBrowserProject({id,title,payload,updatedAt:new Date().toISOString()});Object.assign(state,draft,{projectId:id,projectTitle:title,dashboard:false});creatingProject=false;say('Project created. Changes save in this browser on this device.');draw();return}try{const response=await fetch('/api/projects',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title,payload})});const result=await response.json();if(response.status===401){authExpired();throw new Error('Sign in again to create a server project.')}if(!response.ok)throw new Error(result.error||'Create failed');Object.assign(state,draft,{projectId:result.project.id,projectTitle:title,dashboard:false});creatingProject=false;await refreshProjectList();say('Project created. Changes will autosave.');draw()}catch(error){say('Could not create server project: '+(error instanceof Error?error.message:'server request failed'),true)}}
function applyServerApprovals(records){const list=Array.isArray(records)?records:[];state.serverApprovals=list;const has=(stage,resourceId)=>list.some(item=>item.stage===stage&&(resourceId===undefined||item.resourceId===resourceId));if(state.brief)state.brief.approved=has('brief');state.scriptApproved=has('script');for(const scene of state.scenes||[]){scene.approved=!!scene.image&&has('image',scene.id);scene.approvalStatus=scene.approved?'approved':'pending';for(const segment of scene.voiceSegments||[])segment.approved=!!voiceAudioUrl(segment)&&has('voice',segment.id)}state.voice=voiceIsComplete(state.scenes);const timelineApproval=list.find(item=>item.stage==='timeline');if(state.timeline){const matches=!!timelineApproval&&/^[a-f0-9]{64}$/.test(state.timeline.renderApproval?.manifestHash||'');state.timeline.renderApproval={...(state.timeline.renderApproval||{}),approved:matches,approvedAt:matches?timelineApproval.approvedAt:null}}const thumbnailApproval=list.find(item=>item.stage==='thumbnail');for(const variant of state.thumbnailVariants||[])variant.status=thumbnailApproval?.resourceId===variant.id?'approved':(variant.status==='approved'?'draft':variant.status);state.approvedThumbnailId=thumbnailApproval?.resourceId||'';state.thumb=!!thumbnailApproval&&!!(state.thumbnailVariants||[]).some(item=>item.id===thumbnailApproval.resourceId);state.exported=has('export')&&!!state.exportPackage}

async function deleteProjectAction(id){const item=projectList.find(p=>p.id===id);if(!confirm(`Delete “${item?.title||'this project'}” and its saved references? This cannot be undone.`))return;if(browserStorage){saveBrowserProjects(loadBrowserProjects().filter(project=>project.id!==id));projectList=loadBrowserProjects().map(localProjectSummary);if(state.projectId===id)Object.assign(state,initialState());say('Project deleted from this browser.');draw();return}try{const response=await fetch('/api/projects/'+encodeURIComponent(id),{method:'DELETE'});const result=await response.json();if(!response.ok)throw new Error(result.error||'Delete failed');if(state.projectId===id)Object.assign(state,initialState());await refreshProjectList();say('Project deleted.');draw()}catch(error){if(error?.status===401)authExpired();say('Could not delete server project: '+error.message,true)}}

function readFormIntoState(target){const val=id=>document.querySelector('#'+CSS.escape(id))?.value;const id=target?.id;if(!id)return;if(/^(sceneTitle|sceneText|scenePrompt|sceneSeconds|sceneLocation|sceneOutfit)\d+$/.test(id))return;if(id==='idea'){const next=val(id)||'';invalidateBriefInput(state.idea,next);state.idea=next}else if(id==='reference'){const next=val(id)||'';invalidateBriefInput(state.reference,next);state.reference=next}else if(id==='referenceText'){const next=val(id)||'';invalidateBriefInput(state.referenceText,next);state.referenceText=next}else if(id==='scriptFormat'){const next=val(id)||'narration';if(state.script&&state.scriptFormat!==next){state.scriptApproved=false;resetAfterScript()}state.scriptFormat=next}else if(id==='referenceVideos'){const next=String(val(id)||'').split(/\n/).map(x=>x.trim()).filter(Boolean);invalidateBriefInput(JSON.stringify(state.settings.referenceVideos||[]),JSON.stringify(next));state.settings.referenceVideos=next}else if(id==='durationMinutes'){const next=Math.min(5,Math.max(1,Number(val(id))||1));invalidateBriefInput(state.settings.durationMinutes,next);state.settings.durationMinutes=next}else if(id==='aspectRatio'){const next=val(id)==='9:16'?'9:16':'16:9';invalidateBriefInput(state.settings.aspectRatio,next);state.settings.aspectRatio=next}else if(id==='language'){const next=val(id);invalidateBriefInput(state.settings.language,next);state.settings.language=next}else if(id==='visualStyle'){const next=val(id);invalidateBriefInput(state.settings.visualStyle,next);state.settings.visualStyle=next;}else if(['seriesId','channelId','brandKitId'].includes(id)){const next=val(id)||'';if(state[id]!==next)invalidateBriefInput(state[id],next);state[id]=next;if(id==='seriesId'&&next&&!state.storyContinuity){const summary=entityRecord('series',next)?.previousEpisodeSummary||'';const continuityField=document.querySelector('#storyContinuity');if(continuityField)continuityField.value=summary}if(id==='channelId'){const profile=entityRecord('channels',state.channelId);if(profile){state.settings.language=profile.language||state.settings.language;state.settings.durationMinutes=Number(profile.durationMinutes||state.settings.durationMinutes);state.settings.aspectRatio=profile.aspectRatio||state.settings.aspectRatio;state.settings.visualStyle=profile.visualStyle||state.settings.visualStyle;for(const key of ['language','durationMinutes','aspectRatio','visualStyle']){const control=document.querySelector('#'+key);if(control)control.value=state.settings[key]}state.appliedChannelProfile={targetAudience:profile.targetAudience||'',contentCategory:profile.contentCategory||'',storytellingPreferences:profile.storytellingPreferences||''}}else state.appliedChannelProfile=null}}else if(id==='season'||id==='episode')state[id]=Math.max(1,Number(val(id))||1);else if(id==='storyContinuity'){const next=val(id)||'';invalidateBriefInput(state.storyContinuity,next);state.storyContinuity=next}else if(id==='appearanceOverrides'){try{const next=JSON.parse(val(id)||'{}');invalidateBriefInput(JSON.stringify(state.appearanceOverrides||{}),JSON.stringify(next));state.appearanceOverrides=next}catch{say('Appearance overrides must be valid JSON.',true)}}else if(id==='btitle'||id==='bdirection'||id==='baud'){if(state.brief){const key={btitle:'title',bdirection:'direction',baud:'goal'}[id],next=val(id)||'';if(state.brief[key]!==next){state.brief[key]=next;state.brief.approved=false;resetAfterBrief()}}}else if(id==='script'||id==='scriptReview'){const next=val(id)||'';if(next!==state.script){state.script=next;state.scriptApproved=false;resetAfterScript()}}else if(id.startsWith('sceneLocation')){const i=Number(id.slice(13));if(state.scenes[i])if(state.scenes[i].locationId!==(val(id)||'')){state.scenes[i].locationId=val(id)||'';refreshScenePrompt(state.scenes[i],i);invalidateSceneVisual(i);const prompt=document.querySelector('#prompt'+i);if(prompt)prompt.value=state.scenes[i].prompt}}else if(id.startsWith('sceneOutfit')){const i=Number(id.slice(11));if(state.scenes[i]&&state.scenes[i].outfitOverride!==(val(id)||'')){state.scenes[i].outfitOverride=val(id)||'';refreshScenePrompt(state.scenes[i],i);invalidateSceneVisual(i);const prompt=document.querySelector('#prompt'+i);if(prompt)prompt.value=state.scenes[i].prompt}}else if(id==='editnotes'||id==='postnotes')state.notes=val(id)||'';else if(id==='thumbtext')state.thumbnailText=val(id)||'';else if(id==='resolution'){state.renderResolution=val(id);state.settings.aspectRatio=String(val(id)).includes('9:16')?'9:16':'16:9'}else if(id==='format')state.renderFormat=val(id);else if(id==='renderFps')state.renderFps=Math.max(30,Math.min(60,Number(val(id))||30));else if(id.startsWith('prompt')){const i=Number(id.slice(6));if(state.scenes[i]){const next=val(id)||'';if(state.scenes[i].prompt!==next){state.scenes[i].basePrompt=cleanSceneBase(next);refreshScenePrompt(state.scenes[i],i);state.scenes[i].image=false;state.scenes[i].approved=false;state.scenes[i].imagePromptUsed='';state.voice=false;state.render=false;state.post=false;state.thumb=false;state.exported=false}}}else if(id.startsWith('reviewPrompt')){const i=Number(id.slice(12));if(state.scenes[i])state.scenes[i].regenerationDraft=val(id)||''}else if(id.startsWith('duration-')){const i=Number(id.slice(9));if(state.scenes[i])state.scenes[i].seconds=Math.min(120,Math.max(1,Number(val(id))||1))}navdraw();scheduleAutosave()}
async function handleReferenceUploads(input){const category=input.dataset.category;const files=Array.from(input.files||[]);const existing=state.settings.referenceImages||[];if(existing.length+files.length>12){say('You can store up to 12 reference images per project.',true);input.value='';return}try{const images=await Promise.all(files.map(file=>new Promise((resolve,reject)=>{if(file.size>2*1024*1024){reject(new Error(`${file.name} is over the 2 MB per-image limit.`));return}if(!/^image\/(png|jpeg|webp|gif)$/.test(file.type)){reject(new Error(`${file.name} is not a supported image.`));return}const reader=new FileReader();reader.onload=()=>resolve({name:file.name,type:file.type,category,dataUrl:reader.result});reader.onerror=()=>reject(new Error(`Could not read ${file.name}.`));reader.readAsDataURL(file)})));state.settings.referenceImages=[...existing,...images];say(`${images.length} reference image${images.length===1?'':'s'} added.`);draw();scheduleAutosave()}catch(error){say(error.message,true)}input.value=''}

function formEntity(collection){const config=collections[collection],record=libraryEdit?.collection===collection?entityRecord(collection,libraryEdit.id):null;return `<section class="panel"><h2>${record?'Edit':'Create'} ${singularLabel(collection)}</h2><div class="field"><label for="entityName">${singularLabel(collection)} name</label><input id="entityName" maxlength="120" value="${escapeAttr(record?.name||'')}" placeholder="Enter a name"></div>${config.fields.map(([key,label])=>`<div class="field"><label for="entity-${key}">${label}</label>${key==='durationMinutes'?`<select id="entity-${key}">${[1,2,3,4,5].map(n=>`<option ${Number(record?.[key]||1)===n?'selected':''} value="${n}">${n} minute${n>1?'s':''}</option>`).join('')}</select>`:key==='aspectRatio'?`<select id="entity-${key}"><option ${record?.[key]==='9:16'?'selected':''}>9:16</option><option ${!record?.[key]||record?.[key]==='16:9'?'selected':''}>16:9</option></select>`:`<textarea id="entity-${key}" rows="2" placeholder="${label}">${escapeHtml(record?.[key]||'')}</textarea>`}</div>`).join('')}<div class="field"><label for="entityImages">Reference images (up to 12, 2 MB each)</label><input type="file" id="entityImages" data-library-collection="${collection}" accept="image/png,image/jpeg,image/webp,image/gif" multiple></div>${record?.referenceImages?.length?`<div class="reference-list">${record.referenceImages.map((img,i)=>`<div class="reference-chip"><img src="${img.dataUrl}" alt="${escapeAttr(img.name)}"><span>${escapeHtml(img.name)}</span><button class="text-button" onclick="removeEntityImage('${collection}','${record.id}',${i})">Remove</button></div>`).join('')}</div>`:''}<div class="actions"><button class="primary" onclick="saveEntityForm('${collection}')">${record?'Save changes':'Create'}</button>${record?`<button class="secondary" onclick="duplicateEntityAction('${collection}','${record.id}')">Duplicate</button>`:''}<button class="secondary" onclick="libraryEdit=null;draw()">Cancel</button></div></section>`}
function renderLibrary(collection){const config=collections[collection],rows=libraryData[collection];const cards=rows.map(item=>`<article class="project-card"><div class="project-card-top"><span class="project-icon">${config.icon}</span><span class="state-chip">${item.referenceImages?.length||0} reference images</span></div><h2>${escapeHtml(item.name)}</h2><p class="project-stage">${escapeHtml((item.description||item.appearance||item.visualGuidelines||item.storyline||item.targetAudience||'Reusable library item').slice(0,140))}</p><div class="project-actions"><button class="secondary" onclick="libraryEdit={collection:'${collection}',id:'${item.id}'};draw()">Edit</button><button class="secondary" onclick="duplicateEntityAction('${collection}','${item.id}')">Duplicate</button><button class="danger" onclick="deleteEntityAction('${collection}','${item.id}')">Delete</button></div></article>`).join('');view.innerHTML=`${managementTabs()}<div class="dashboard-heading"><div><div class="eyebrow">REUSABLE ASSETS</div><h1>${config.label}</h1><p>Create profiles once and reuse them in video projects.</p></div><button class="primary new-project-button" onclick="libraryEdit={collection:'${collection}',id:null};draw()">＋ Add ${singularLabel(collection)}</button></div>${libraryEdit?.collection===collection?formEntity(collection):''}<div class="projects-grid">${cards||`<div class="empty dashboard-empty"><strong>No ${config.label.toLowerCase()} yet</strong><br>Add a reusable ${singularLabel(collection).toLowerCase()} to get started.</div>`}</div>`}
function managementTabs(){return `<nav class="management-tabs" aria-label="Project management">${[['projects','Projects'],['queue','Production queue'],['billing','Cloud usage & billing'],...Object.entries(collections).map(([key,c])=>[key,c.label]),['backup','Backup & restore']].map(([key,label])=>`<button class="secondary ${dashboardSection===key?'tab-selected':''}" onclick="dashboardSection='${key}';libraryEdit=null;draw()">${label}</button>`).join('')}</nav>`}
function projectStatus(item){return item.status||item.payload?.projectStatus||'Draft'}
function renderProjectManager(){const statuses=['Draft','In Progress','Awaiting Approval','Completed','Archived'];let projects=projectList.filter(p=>{const payload=p.payload||{};const seriesId=payload.seriesId||p.seriesId||'';const channelId=payload.channelId||p.channelId||'';const search=`${p.title} ${p.status||''} ${p.stage||''}`.toLowerCase();return(!projectFilters.search||search.includes(projectFilters.search.toLowerCase()))&&(projectFilters.status==='all'||projectStatus(p)===projectFilters.status)&&(projectFilters.series==='all'||seriesId===projectFilters.series)&&(projectFilters.channel==='all'||channelId===projectFilters.channel)});projects.sort((a,b)=>projectFilters.sort==='name'?a.title.localeCompare(b.title):projectFilters.sort==='priority'?Number(a.priority??a.payload?.priority??3)-Number(b.priority??b.payload?.priority??3):Date.parse(b.updatedAt)-Date.parse(a.updatedAt));const cards=projects.map(p=>{const payload=p.payload||{};const status=projectStatus(p);return `<article class="project-card"><div class="project-card-top"><span class="project-icon">▶</span><select aria-label="${escapeAttr(p.title)} status" onchange="updateProjectMetadata('${p.id}','projectStatus',this.value)">${statuses.map(s=>`<option ${s===status?'selected':''}>${s}</option>`).join('')}</select></div><h2>${escapeHtml(p.title)}</h2><p class="project-stage">${escapeHtml(p.stage||stageSummary(payload))} · ${Math.min(100,Math.round((Number(payload.step||0)/12)*100))}% complete</p><div class="field"><label>Manual queue priority</label><select aria-label="${escapeAttr(p.title)} priority" onchange="updateProjectMetadata('${p.id}','priority',Number(this.value))">${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(p.priority||payload.priority||3)===n?'selected':''}>${n} · ${['Urgent','High','Normal','Low','Later'][n-1]}</option>`).join('')}</select></div><div class="row"><div class="field"><label>Series</label><select onchange="updateProjectMetadata('${p.id}','seriesId',this.value)"><option value="">Standalone video</option>${libraryData.series.map(x=>`<option value="${x.id}" ${payload.seriesId===x.id?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}</select></div><div class="field"><label>Channel profile</label><select onchange="updateProjectMetadata('${p.id}','channelId',this.value)"><option value="">None</option>${libraryData.channels.map(x=>`<option value="${x.id}" ${payload.channelId===x.id?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}</select></div></div><div class="project-actions"><button class="primary" onclick="openProject('${p.id}')">Open project</button><button class="secondary" onclick="editingProjectId='${p.id}';draw()">Edit title</button><button class="secondary" onclick="duplicateProject('${p.id}')">Duplicate</button><button class="danger" onclick="deleteProjectAction('${p.id}')">Delete</button><button class="secondary" onclick="exportOne('${p.id}')">Export</button></div></article>`}).join('');view.innerHTML=`${managementTabs()}<div class="dashboard-heading"><div><div class="eyebrow">YOUR WORKSPACE</div><h1>Video projects</h1><p>Search, organize and prioritize your video production.</p></div><button class="primary new-project-button" onclick="creatingProject=!creatingProject;draw()">＋ New project</button></div><section class="project-search-top"><label for="projectSearch">Search projects</label><input id="projectSearch" value="${escapeAttr(projectFilters.search)}" placeholder="Search by project name, status or stage" autocomplete="off"></section><section class="panel dashboard-filter-panel"><div class="dashboard-filters"><div class="field"><label for="projectStatusFilter">Status</label><select id="projectStatusFilter" onchange="projectFilters.status=this.value;draw()"><option value="all" ${projectFilters.status==='all'?'selected':''}>All Status</option>${statuses.map(s=>`<option value="${s}" ${projectFilters.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="projectSeriesFilter">Series</label><select id="projectSeriesFilter" onchange="projectFilters.series=this.value;draw()"><option value="all" ${projectFilters.series==='all'?'selected':''}>All Series</option>${libraryData.series.map(x=>`<option value="${x.id}" ${projectFilters.series===x.id?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}</select></div><div class="field"><label for="projectChannelFilter">Channel</label><select id="projectChannelFilter" onchange="projectFilters.channel=this.value;draw()"><option value="all" ${projectFilters.channel==='all'?'selected':''}>All Channels</option>${libraryData.channels.map(x=>`<option value="${x.id}" ${projectFilters.channel===x.id?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}</select></div><div class="field"><label for="projectSortFilter">Sort</label><select id="projectSortFilter" onchange="projectFilters.sort=this.value;draw()"><option value="recent" ${projectFilters.sort==='recent'?'selected':''}>Recently updated</option><option value="name" ${projectFilters.sort==='name'?'selected':''}>Name</option><option value="priority" ${projectFilters.sort==='priority'?'selected':''}>Queue priority</option></select></div></div></section><div class="dashboard-stats"><div><strong>${projectList.length}</strong><span>Total projects</span></div><div><strong>${projectList.filter(p=>projectStatus(p)==='In Progress').length}</strong><span>In progress</span></div><div><strong>${projectList.filter(p=>projectStatus(p)==='Awaiting Approval').length}</strong><span>Awaiting approval</span></div></div>${creatingProject?`<section class="panel create-project"><h2>Create a project</h2><label class="field">Project name<input id="newProjectTitle" maxlength="120" placeholder="e.g. Spring brand story"></label><div class="field"><label>Apply a channel profile</label><select id="newProjectChannel"><option value="">Choose later</option>${libraryData.channels.map(x=>`<option value="${x.id}">${escapeHtml(x.name)}</option>`).join('')}</select></div><div class="actions"><button class="primary" onclick="createProjectAction()">Create project</button><button class="secondary" onclick="creatingProject=false;draw()">Cancel</button></div></section>`:''}<div class="projects-grid">${cards||`<div class="empty dashboard-empty"><strong>${projectList.length?'No matching projects':'No projects yet'}</strong><br>${projectList.length?'Change the search or filters.':'Create a video project to open the production workspace.'}</div>`}</div><p class="help storage-note">${browserStorage?'Projects and libraries save in browser-local storage on this device.':'Projects and libraries save in SQLite on this app server.'} Simulated AI only.</p>`;document.querySelector('#projectSearch')?.addEventListener('input',e=>{projectFilters.search=e.target.value;const pos=e.target.selectionStart;renderProjectManager();const input=document.querySelector('#projectSearch');input.focus();input.setSelectionRange(pos,pos)})}

function nextBillingReset(){const now=new Date(),reset=new Date(now.getFullYear(),now.getMonth()+1,1);return reset.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}
