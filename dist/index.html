function escapeAttr(value){return escapeHtml(value).replace(/`/g,'&#96;')}
function entityRecord(collection,id){return libraryData[collection].find(item=>item.id===id)}
function formEntity(collection){const config=collections[collection],record=libraryEdit?.collection===collection?entityRecord(collection,libraryEdit.id):null;return `<section class="panel"><h2>${record?'Edit':'Create'} ${config.label.slice(0,-1)}</h2><div class="field"><label for="entityName">${config.label.slice(0,-1)} name</label><input id="entityName" maxlength="120" value="${escapeAttr(record?.name||'')}" placeholder="Enter a name"></div>${config.fields.map(([key,label])=>`<div class="field"><label for="entity-${key}">${label}</label>${key==='durationMinutes'?`<select id="entity-${key}">${[1,2,3,4,5].map(n=>`<option ${Number(record?.[key]||1)===n?'selected':''} value="${n}">${n} minute${n>1?'s':''}</option>`).join('')}</select>`:key==='aspectRatio'?`<select id="entity-${key}"><option ${record?.[key]==='9:16'?'selected':''}>9:16</option><option ${!record?.[key]||record?.[key]==='16:9'?'selected':''}>16:9</option></select>`:`<textarea id="entity-${key}" rows="2" placeholder="${label}">${escapeHtml(record?.[key]||'')}</textarea>`}</div>`).join('')}<div class="field"><label for="entityImages">Reference images (up to 12, 2 MB each)</label><input type="file" id="entityImages" data-library-collection="${collection}" accept="image/png,image/jpeg,image/webp,image/gif" multiple></div>${record?.referenceImages?.length?`<div class="reference-list">${record.referenceImages.map((img,i)=>`<div class="reference-chip"><img src="${img.dataUrl}" alt="${escapeAttr(img.name)}"><span>${escapeHtml(img.name)}</span><button class="text-button" onclick="removeEntityImage('${collection}','${record.id}',${i})">Remove</button></div>`).join('')}</div>`:''}<div class="actions"><button class="primary" onclick="saveEntityForm('${collection}')">${record?'Save changes':'Create'}</button>${record?`<button class="secondary" onclick="duplicateEntityAction('${collection}','${record.id}')">Duplicate</button>`:''}<button class="secondary" onclick="libraryEdit=null;draw()">Cancel</button></div></section>`}
function renderLibrary(collection){const config=collections[collection],rows=libraryData[collection];const cards=rows.map(item=>`<article class="project-card"><div class="project-card-top"><span class="project-icon">${config.icon}</span><span class="state-chip">${item.referenceImages?.length||0} reference images</span></div><h2>${escapeHtml(item.name)}</h2><p class="project-stage">${escapeHtml((item.description||item.appearance||item.visualGuidelines||item.storyline||item.targetAudience||'Reusable library item').slice(0,140))}</p><div class="project-actions"><button class="secondary" onclick="libraryEdit={collection:'${collection}',id:'${item.id}'};draw()">Edit</button><button class="secondary" onclick="duplicateEntityAction('${collection}','${item.id}')">Duplicate</button><button class="danger" onclick="deleteEntityAction('${collection}','${item.id}')">Delete</button></div></article>`).join('');view.innerHTML=`${managementTabs()}<div class="dashboard-heading"><div><div class="eyebrow">REUSABLE ASSETS</div><h1>${config.label}</h1><p>Create profiles once and reuse them in video projects.</p></div><button class="primary new-project-button" onclick="libraryEdit={collection:'${collection}',id:null};draw()">＋ Add ${config.label.slice(0,-1)}</button></div>${libraryEdit?.collection===collection?formEntity(collection):''}<div class="projects-grid">${cards||`<div class="empty dashboard-empty"><strong>No ${config.label.toLowerCase()} yet</strong><br>Add a reusable ${config.label.slice(0,-1).toLowerCase()} to get started.</div>`}</div>`}
function managementTabs(){return `<nav class="management-tabs" aria-label="Project management">${[['projects','Projects'],['queue','Production queue'],...Object.entries(collections).map(([key,c])=>[key,c.label]),['backup','Backup & restore']].map(([key,label])=>`<button class="secondary ${dashboardSection===key?'tab-selected':''}" onclick="dashboardSection='${key}';libraryEdit=null;draw()">${label}</button>`).join('')}</nav>`}
function projectStatus(item){return item.status||item.payload?.projectStatus||'Draft'}
function renderProjectManager(){const statuses=['Draft','In Progress','Awaiting Approval','Completed','Archived'];let projects=projectList.filter(p=>{const payload=p.payload||{};const search=`${p.title} ${p.status||''}`.toLowerCase();return(!projectFilters.search||search.includes(projectFilters.search.toLowerCase()))&&(projectFilters.status==='All'||projectStatus(p)===projectFilters.status)&&(projectFilters.series==='All'||payload.seriesId===projectFilters.series||p.seriesId===projectFilters.series)&&(projectFilters.channel==='All'||payload.channelId===projectFilters.channel||p.channelId===projectFilters.channel)});projects.sort((a,b)=>projectFilters.sort==='name'?a.title.localeCompare(b.title):projectFilters.sort==='priority'?(a.priority||3)-(b.priority||3):Date.parse(b.updatedAt)-Date.parse(a.updatedAt));const cards=projects.map(p=>{const payload=p.payload||{};const status=projectStatus(p);return `<article class="project-card"><div class="project-card-top"><span class="project-icon">▶</span><select aria-label="${escapeAttr(p.title)} status" onchange="updateProjectMetadata('${p.id}','projectStatus',this.value)">${statuses.map(s=>`<option ${s===status?'selected':''}>${s}</option>`).join('')}</select></div><h2>${escapeHtml(p.title)}</h2><p class="project-stage">${escapeHtml(p.stage||stageSummary(payload))} · ${Math.min(100,Math.round((Number(payload.step||0)/12)*100))}% complete</p><div class="field"><label>Manual queue priority</label><select aria-label="${escapeAttr(p.title)} priority" onchange="updateProjectMetadata('${p.id}','priority',Number(this.value))">${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(p.priority||payload.priority||3)===n?'selected':''}>${n} · ${['Urgent','High','Normal','Low','Later'][n-1]}</option>`).join('')}</select></div><div class="row"><div class="field"><label>Series</label><select onchange="updateProjectMetadata('${p.id}','seriesId',this.value)"><option value="">Standalone video</option>${libraryData.series.map(x=>`<option value="${x.id}" ${payload.seriesId===x.id?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}</select></div><div class="field"><label>Channel profile</label><select onchange="updateProjectMetadata('${p.id}','channelId',this.value)"><option value="">None</option>${libraryData.channels.map(x=>`<option value="${x.id}" ${payload.channelId===x.id?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}</select></div></div><div class="project-actions"><button class="primary" onclick="openProject('${p.id}')">Open project</button><button class="secondary" onclick="editingProjectId='${p.id}';draw()">Edit title</button><button class="secondary" onclick="duplicateProject('${p.id}')">Duplicate</button><button class="danger" onclick="deleteProjectAction('${p.id}')">Delete</button><button class="secondary" onclick="exportOne('${p.id}')">Export</button></div></article>`}).join('');view.innerHTML=`${managementTabs()}<div class="dashboard-heading"><div><div class="eyebrow">YOUR WORKSPACE</div><h1>Video projects</h1><p>Search, organize and prioritize your video production.</p></div><button class="primary new-project-button" onclick="creatingProject=!creatingProject;draw()">＋ New project</button></div><div class="dashboard-stats"><div><strong>${projectList.length}</strong><span>Total projects</span></div><div><strong>${projectList.filter(p=>projectStatus(p)==='In Progress').length}</strong><span>In progress</span></div><div><strong>${projectList.filter(p=>projectStatus(p)==='Awaiting Approval').length}</strong><span>Awaiting approval</span></div></div><section class="panel"><div class="row"><div class="field"><label for="projectSearch">Search projects</label><input id="projectSearch" value="${escapeAttr(projectFilters.search)}" placeholder="Search by project name"></div><div class="field"><label>Status</label><select onchange="projectFilters.status=this.value;draw()"><option>All</option>${statuses.map(s=>`<option ${projectFilters.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Series</label><select onchange="projectFilters.series=this.value;draw()"><option>All</option>${libraryData.series.map(x=>`<option value="${x.id}" ${projectFilters.series===x.id?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}</select></div><div class="field"><label>Channel</label><select onchange="projectFilters.channel=this.value;draw()"><option>All</option>${libraryData.channels.map(x=>`<option value="${x.id}" ${projectFilters.channel===x.id?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}</select></div><div class="field"><label>Sort</label><select onchange="projectFilters.sort=this.value;draw()"><option value="recent" ${projectFilters.sort==='recent'?'selected':''}>Recently updated</option><option value="name" ${projectFilters.sort==='name'?'selected':''}>Name</option><option value="priority" ${projectFilters.sort==='priority'?'selected':''}>Queue priority</option></select></div></div></section>${creatingProject?`<section class="panel create-project"><h2>Create a project</h2><label class="field">Project name<input id="newProjectTitle" maxlength="120" placeholder="e.g. Spring brand story"></label><div class="field"><label>Apply a channel profile</label><select id="newProjectChannel"><option value="">Choose later</option>${libraryData.channels.map(x=>`<option value="${x.id}">${escapeHtml(x.name)}</option>`).join('')}</select></div><div class="actions"><button class="primary" onclick="createProjectAction()">Create project</button><button class="secondary" onclick="creatingProject=false;draw()">Cancel</button></div></section>`:''}<div class="projects-grid">${cards||`<div class="empty dashboard-empty"><strong>${projectList.length?'No matching projects':'No projects yet'}</strong><br>${projectList.length?'Change the search or filters.':'Create a video project to open the production workspace.'}</div>`}</div><p class="help storage-note">${browserStorage?'Projects and libraries save in browser-local storage on this device.':'Projects and libraries save in SQLite on this app server.'} Simulated AI only.</p>`;document.querySelector('#projectSearch')?.addEventListener('input',e=>{projectFilters.search=e.target.value;const pos=e.target.selectionStart;renderProjectManager();const input=document.querySelector('#projectSearch');input.focus();input.setSelectionRange(pos,pos)})}
function renderQueue(){const ordered=[...projectList].sort((a,b)=>(Number(a.priority||3)-Number(b.priority||3))||Date.parse(b.updatedAt)-Date.parse(a.updatedAt));view.innerHTML=`${managementTabs()}<div class="dashboard-heading"><div><div class="eyebrow">MANUAL PRODUCTION ORDER</div><h1>Production queue</h1><p>Set each project's priority from the project list. Lower numbers publish sooner.</p></div></div><div class="projects-grid">${ordered.map((p,i)=>`<article class="project-card"><div class="project-card-top"><span class="project-icon">${String(i+1).padStart(2,'0')}</span><span class="state-chip">Priority ${p.priority||3}</span></div><h2>${escapeHtml(p.title)}</h2><p class="project-stage">${escapeHtml(projectStatus(p))} · ${escapeHtml(p.stage||'Idea')}</p><div class="project-actions"><button class="secondary" onclick="updateProjectMetadata('${p.id}','priority',Math.max(1,Number(${p.priority||3})-1))">↑ Raise priority</button><button class="secondary" onclick="updateProjectMetadata('${p.id}','priority',Math.min(5,Number(${p.priority||3})+1))">↓ Lower priority</button><button class="primary" onclick="openProject('${p.id}')">Open</button></div></article>`).join('')||'<div class="empty">Your production queue is empty.</div>'}</div>`}
function renderBackup(){view.innerHTML=`${managementTabs()}<div class="dashboard-heading"><div><div class="eyebrow">PORTABLE PROJECT DATA</div><h1>Backup & restore</h1><p>Exports include project settings, approvals, script versions and references.</p></div></div><section class="panel"><h2>Export library</h2><p class="sub">Download all projects and reusable libraries as one JSON backup.</p><div class="actions"><button class="primary" onclick="exportLibrary()">Export complete library</button><button class="secondary" onclick="document.querySelector('#importData').click()">Import backup</button><input id="importData" type="file" accept="application/json,.json" hidden></div><p class="help">Imports are validated and added as new records. Existing projects and libraries are never overwritten.</p></section><div class="projects-grid">${projectList.map(p=>`<article class="project-card"><h2>${escapeHtml(p.title)}</h2><p class="project-stage">${escapeHtml(projectStatus(p))} · ${escapeHtml(p.stage||'Idea')}</p><button class="secondary" onclick="exportOne('${p.id}')">Export this project</button></article>`).join('')||'<div class="empty">No projects are available to export yet.</div>'}</div>`;document.querySelector('#importData')?.addEventListener('change',handleImportFile)}
function drawManagement(){document.body.classList.add('dashboard-mode');document.querySelector('#activeProjectName').textContent='Project management';document.querySelector('#themeToggle').textContent=document.documentElement.dataset.theme==='light'?'◐ Dark mode':'☼ Light mode';if(dashboardSection==='projects')renderProjectManager();else if(dashboardSection==='queue')renderQueue();else if(dashboardSection==='backup')renderBackup();else renderLibrary(dashboardSection)}
async function saveEntity(collection,record){libraryData[collection]=libraryData[collection].filter(item=>item.id!==record.id).concat(record);saveLocalLibrary();try{const response=await fetch('/api/entities/'+collection,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({record})});if(!response.ok)throw Error('SQLite unavailable')}catch{} }
async function saveEntityForm(collection){const config=collections[collection],existing=libraryEdit?.collection===collection?entityRecord(collection,libraryEdit.id):null;const name=document.querySelector('#entityName')?.value.trim();if(!name){say('Enter a name before saving.',true);return}const record={...(existing||{}),id:existing?.id||entityId(),name,referenceImages:existing?.referenceImages||[]};for(const [key] of config.fields)record[key]=document.querySelector('#entity-'+key)?.value.trim()||'';if(collection==='channels'){record.durationMinutes=Number(record.durationMinutes||1);record.aspectRatio=record.aspectRatio||'16:9'}await saveEntity(collection,record);libraryEdit=null;say(`${config.label.slice(0,-1)} saved.`);draw()}
async function deleteEntityAction(collection,id){const item=entityRecord(collection,id);if(!confirm(`Delete “${item?.name||'this item'}” from the reusable library? Existing project snapshots are preserved.`))return;libraryData[collection]=libraryData[collection].filter(x=>x.id!==id);saveLocalLibrary();try{await fetch('/api/entities/'+collection+'?id='+encodeURIComponent(id),{method:'DELETE'})}catch{}say('Library item deleted.');draw()}
async function duplicateEntityAction(collection,id){const source=entityRecord(collection,id);if(!source)return;const copy={...JSON.parse(JSON.stringify(source)),id:entityId(),name:'Copy of '+source.name};await saveEntity(collection,copy);say('Library item duplicated.');draw()}
async function handleEntityUploads(input){const collection=input.dataset.libraryCollection,id=libraryEdit?.collection===collection?libraryEdit.id:null;let record=id?entityRecord(collection,id):null;if(!record){say('Create and save this item first, then edit it to add reference images.',true);input.value='';return}const files=[...input.files||[]];if((record.referenceImages?.length||0)+files.length>12){say('A library item can hold up to 12 images.',true);input.value='';return}try{const images=await Promise.all(files.map(file=>new Promise((resolve,reject)=>{if(file.size>2*1024*1024||!/^image\/(png|jpeg|webp|gif)$/.test(file.type)){reject(Error(`${file.name} must be PNG, JPEG, WebP, or GIF under 2 MB.`));return}const reader=new FileReader();reader.onload=()=>resolve({name:file.name,type:file.type,dataUrl:reader.result});reader.onerror=()=>reject(Error('Could not read '+file.name));reader.readAsDataURL(file)})));record.referenceImages=[...(record.referenceImages||[]),...images];await saveEntity(collection,record);say(`${images.length} reference image${images.length===1?'':'s'} saved.`);draw()}catch(error){say(error.message,true)}input.value=''}
async function removeEntityImage(collection,id,index){const record=entityRecord(collection,id);if(!record)return;record.referenceImages.splice(index,1);await saveEntity(collection,record);draw()}
async function updateProjectMetadata(id,key,value){const item=projectList.find(p=>p.id===id);if(!item)return;try{let payload=item.payload;if(!payload){const response=await fetch('/api/projects/'+encodeURIComponent(id));payload=(await response.json()).project.payload}else payload={...payload};payload[key]=value;if(key==='projectStatus')payload.projectStatus=value;if(key==='priority')payload.priority=value;const response=await fetch('/api/projects/'+encodeURIComponent(id),{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({payload})});if(!response.ok)throw Error();item.payload=payload;item.status=payload.projectStatus;item.priority=payload.priority;item.updatedAt=new Date().toISOString()}catch{const local=loadBrowserProjects().find(p=>p.id===id);if(local){local.payload[key]=value;if(key==='projectStatus')local.payload.projectStatus=value;if(key==='priority')local.payload.priority=value;local.updatedAt=new Date().toISOString();storeBrowserProject(local);item.payload=local.payload;item.status=local.payload.projectStatus;item.priority=local.payload.priority}}draw()}
function downloadJson(filename,data){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url)}
async function exportOne(id){let p=loadBrowserProjects().find(x=>x.id===id);if(!p){const response=await fetch('/api/projects/'+encodeURIComponent(id));if(response.ok){const {project}=await response.json();p={id:project.id,title:project.title,payload:project.payload,createdAt:project.createdAt,updatedAt:project.updatedAt}}}if(p)downloadJson(`ccai-project-${p.title.replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.json`,{format:'ccai-project',version:1,project:p})}
async function exportLibrary(){let projects=loadBrowserProjects();if(!browserStorage){try{const list=await (await fetch('/api/projects')).json();projects=await Promise.all(list.projects.map(async item=>(await (await fetch('/api/projects/'+encodeURIComponent(item.id))).json()).project))}catch{}}downloadJson('ccai-library-backup.json',{format:'ccai-library',version:1,exportedAt:new Date().toISOString(),projects,library:libraryData})}
function validImportPayload(payload){if(!payload||typeof payload!=='object'||Array.isArray(payload))return false;const settings=payload.settings||{};if(settings.referenceImages!==undefined&&(!Array.isArray(settings.referenceImages)||settings.referenceImages.length>12||settings.referenceImages.some(img=>!img||typeof img.dataUrl!=='string'||img.dataUrl.length>2800000||!/^data:image\/(png|jpeg|webp|gif);base64,/i.test(img.dataUrl))))return false;if(settings.referenceVideos!==undefined&&(!Array.isArray(settings.referenceVideos)||settings.referenceVideos.length>20||settings.referenceVideos.some(url=>typeof url!=='string'||!/^https:\/\//i.test(url))))return false;if(payload.scriptVersions!==undefined&&(!Array.isArray(payload.scriptVersions)||payload.scriptVersions.length>200||payload.scriptVersions.some(item=>!item||typeof item.text!=='string')))return false;if(payload.scenes!==undefined&&(!Array.isArray(payload.scenes)||payload.scenes.length>100))return false;if(payload.characterIds!==undefined&&(!Array.isArray(payload.characterIds)||payload.characterIds.some(id=>typeof id!=='string')))return false;if(payload.locationIds!==undefined&&(!Array.isArray(payload.locationIds)||payload.locationIds.some(id=>typeof id!=='string')))return false;return true}
async function handleImportFile(event){const file=event.target.files?.[0];if(!file)return;try{if(file.size>40*1024*1024)throw Error('Backup exceeds 40 MB.');const data=JSON.parse(await file.text());if(!['ccai-library','ccai-project'].includes(data.format)||data.version!==1)throw Error('Unsupported CCAI backup format.');const projects=data.format==='ccai-project'?[data.project]:data.projects;if(!Array.isArray(projects))throw Error('Backup does not contain a project list.');for(const project of projects){if(!project||typeof project.title!=='string'||!validImportPayload(project.payload))throw Error('A project record is invalid.');if(JSON.stringify(project).length>40_000_000)throw Error('An imported project exceeds the size limit.')}const libraries=data.format==='ccai-library'?(data.library||{}):{};for(const key of Object.keys(collections))if(libraries[key]!==undefined&&(!Array.isArray(libraries[key])||libraries[key].some(item=>!item||typeof item.name!=='string'||!item.name.trim()||typeof item.id!=='string'||(item.referenceImages!==undefined&&(!Array.isArray(item.referenceImages)||item.referenceImages.length>12||item.referenceImages.some(img=>!img||typeof img.dataUrl!=='string'||img.dataUrl.length>2800000||!/^data:image\/(png|jpeg|webp|gif);base64,/i.test(img.dataUrl)))))))throw Error(`Invalid ${collections[key].label} data.`);if(!confirm(`Import ${projects.length} project(s) and reusable records as new copies? Existing records will not be overwritten.`))return;const importedIds={};for(const key of Object.keys(collections)){for(const record of libraries[key]||[]){const copy={...record,id:entityId()};importedIds[record.id]=copy.id;await saveEntity(key,copy)}}for(const source of projects){const payload=JSON.parse(JSON.stringify(source.payload));for(const key of ['seriesId','channelId','brandKitId','locationId'])if(payload[key]&&importedIds[payload[key]])payload[key]=importedIds[payload[key]];for(const key of ['characterIds','locationIds'])if(Array.isArray(payload[key]))payload[key]=payload[key].map(id=>importedIds[id]||id);if(payload.appearanceOverrides)payload.appearanceOverrides=Object.fromEntries(Object.entries(payload.appearanceOverrides).map(([id,value])=>[importedIds[id]||id,value]));for(const scene of payload.scenes||[]){if(scene.locationId&&importedIds[scene.locationId])scene.locationId=importedIds[scene.locationId];if(Array.isArray(scene.characterIds))scene.characterIds=scene.characterIds.map(id=>importedIds[id]||id)}const title='Imported · '+source.title;if(browserStorage){storeBrowserProject({id:makeProjectId(),title,payload:JSON.parse(JSON.stringify(payload)),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()})}else{const response=await fetch('/api/projects',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title,payload})});if(!response.ok)throw Error((await response.json()).error||'Import failed')}}await refreshProjectList();say('Backup imported as new copies. Existing data was preserved.');draw()}catch(error){say(error instanceof Error?error.message:'Could not import backup.',true)}finally{event.target.value=''}}

refreshLibrary().then(()=>refreshProjectList()).then(()=>draw());try{const theme=localStorage.getItem('ccai-theme');if(theme)document.documentElement.dataset.theme=theme}catch{}draw();</script></body></html>
