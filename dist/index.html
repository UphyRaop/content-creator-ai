</style></head><body><div class="layout"><aside class="side"><div class="brand">CCAI <i>/</i> VIDEO STUDIO</div><div class="over">PRODUCTION WORKFLOW</div><nav id="nav" class="steps" aria-label="Video workflow"></nav><div class="sidefoot"><strong id="storageLabel">SQLite storage</strong><span id="storageDescription">Projects autosave to this app's SQLite database.</span></div></aside><main class="main"><header class="top"><button class="secondary top-btn" onclick="showDashboard()" aria-label="Back to projects">← Projects</button><span id="activeProjectName">Project workspace</span><div class="top-right"><span class="demo">SIMULATED · COST RM0</span><button class="secondary top-btn" id="themeToggle" onclick="toggleTheme()">☼ Light mode</button></div></header><div class="content"><div id="notice" class="notice" role="status" aria-live="polite">Projects save automatically.</div><div id="view"></div><footer><span>CCAI VIDEO STUDIO · INTERACTIVE PROTOTYPE</span><span>AI provider integrations are simulated</span></footer></div></main></div><script>
const names=['Idea & references','Creative brief','AI script','Script approval','Scene breakdown','Image generation','Scene approval','Voice generation','Timeline & edit','Video render','Post-production','Thumbnail','Video export'];
function initialState(title='Untitled video'){return{step:0,projectId:null,projectTitle:title,dashboard:true,projectStatus:'Draft',priority:3,seriesId:'',season:1,episode:1,channelId:'',brandKitId:'',appliedChannelProfile:null,characterIds:[],locationIds:[],appearanceOverrides:{},storyContinuity:'',idea:'',reference:'',referenceText:'',brief:null,script:'',scriptSavedText:'',scriptVersions:[],scriptFormat:'narration',scriptApproved:false,scriptUsage:[],scenes:[],voice:false,render:false,post:false,thumb:false,exported:false,notes:'',thumbnailText:'',settings:{durationMinutes:1,aspectRatio:'16:9',language:'English',visualStyle:'Cinematic documentary',referenceImages:[],referenceVideos:[]}}}
const state=initialState();
const BROWSER_PROJECTS_KEY='ccai-projects-v1';
let autosaveTimer=null,autosaveChain=Promise.resolve(),projectList=[],editingProjectId=null,creatingProject=false,autosaveVersion=0,browserStorage=false;
const nav=document.querySelector('#nav'),view=document.querySelector('#view'),notice=document.querySelector('#notice');
function say(s,w=false){notice.textContent=s;notice.className='notice'+(w?' warn':'')}
function button(label,fn,cls='primary',disabled=false){return `<button class="${cls}" ${disabled?'disabled':''} onclick="${fn}">${label}</button>`}
function setStep(i){state.step=i;draw()}
function unlock(i){return i===0|| (i===1&&state.idea.trim()) || (i===2&&state.brief) || (i===3&&state.script) || (i===4&&state.scriptApproved) || (i===5&&state.scenes.length) || (i===6&&state.scenes.length) || (i===7&&state.scenes.length&&state.scenes.every(s=>s.approved)) || (i===8&&state.voice) || (i===9&&state.voice) || (i===10&&state.render) || (i===11&&state.post) || (i===12&&state.thumb)}
function navdraw(){document.body.classList.toggle('dashboard-mode',state.dashboard);nav.innerHTML=names.map((n,i)=>`<button class="step ${state.step===i?'selected':''} ${unlock(i)?'':'locked'} ${i<state.step?'done':''}" onclick="${unlock(i)?`setStep(${i})`:''}" aria-label="Step ${i+1}: ${n}${unlock(i)?'':' locked'}"><span class="n">${i<state.step?'✓':String(i+1).padStart(2,'0')}</span><span>${n}</span></button>`).join('')}
function head(kicker,title,desc){return `<div class="heading"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div></div>`}
function escapeHtml(value){return String(value??'').replace(/[&<>\"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[char]))}
function field(label,id,value,placeholder='',area=false){const safe=escapeHtml(value);return `<div class="field"><label for="${id}">${label}</label>${area?`<textarea id="${id}" placeholder="${placeholder}">${safe}</textarea>`:`<input id="${id}" value="${safe}" placeholder="${placeholder}">`}</div>`}
function draw(){navdraw();if(state.dashboard){drawManagement();return}document.querySelector('#activeProjectName').textContent=state.projectTitle||'Project workspace';document.querySelector('#themeToggle').textContent=document.documentElement.dataset.theme==='light'?'◐ Dark mode':'☼ Light mode';let h='';switch(state.step){
case 0:h=head('STEP 01 · PROJECT INPUT','What video do you want to make?','Share an idea, references, and any transcript or accessible video context.');h+=`<section class="panel"><h2>Start your video</h2><p class="sub">Choose a working title and describe the video in your own words.</p>${field('Video idea','idea',state.idea,'e.g. A short brand story about a family bakery')}${field('Reference links or notes (optional)','reference',state.reference,'Describe context, goals, or paste notes',true)}${field('Reference transcript or accessible video content','referenceText',state.referenceText,'Paste a transcript or relevant excerpts. Remote video links are not fetched automatically.',true)}${projectSettingsFields()}${projectContextFields()}<div class="actions">${button('Generate creative brief','captureIdea()')}</div></section><p class="help">Reference links are saved as context. For reliable reference analysis, paste a transcript, description, or accessible excerpt above.</p>`;break;
case 1:h=head('STEP 02 · APPROVAL GATE','Creative brief','Review the simulated brief and approve it before script generation.');if(!state.brief){h+=`<section class="panel"><h2>Draft creative brief</h2><p class="sub">A no-cost simulated brief is prepared from your idea and reference context.</p><div class="empty">Enter an idea and generate a brief from Idea & references.</div></section>`}else{h+=`<section class="panel"><div class="summary"><span class="pill">${state.brief.durationMinutes||Math.max(1,Math.round((state.brief.duration||60)/60))} min</span><span class="pill">${state.brief.tone}</span><span class="pill">${state.brief.audience}</span><span class="pill">${state.brief.language||state.settings.language}</span></div>${field('Working title','btitle',state.brief.title)}${field('Creative direction','bdirection',state.brief.direction,'',true)}${field('Audience and goal','baud',state.brief.goal,'',true)}<p class="help">This preview uses simulated generation. Reference URLs are not fetched; pasted notes and transcript text are used as context.</p><div class="actions">${button('Save edits','saveBrief()','secondary')}${button(state.brief.approved?'Brief approved ✓':'Approve creative brief','approveBrief()',state.brief.approved?'secondary':'primary')}</div></section>`}break;
case 2:h=head('STEP 03 · SIMULATED GEMINI','Script development','Review script length, format, language, and version history. Preview mode makes no API calls.');h+=`<section class="panel"><h2>Video script</h2><p class="sub">${state.brief?.approved?'Creative brief approved.':'Approve the brief to unlock generation.'}</p><div class="row"><div class="field"><label for="scriptFormat">Script format</label><select id="scriptFormat"><option value="narration" ${state.scriptFormat==='narration'?'selected':''}>Narration</option><option value="dialogue" ${state.scriptFormat==='dialogue'?'selected':''}>Character dialogue</option><option value="mixed" ${state.scriptFormat==='mixed'?'selected':''}>Mixed narration and dialogue</option></select></div><div class="field"><label>Selected language and style</label><div class="export">${escapeHtml(state.settings.language)} · ${escapeHtml(state.settings.visualStyle)} · ${state.settings.durationMinutes} min</div></div></div>${state.script?field('Editable script','script',state.script,'',true):'<div class="empty">No script yet. Generate after approving the creative brief.</div>'}${state.script?`<div class="summary"><span class="pill">${wordCountPreview(state.script)} words</span><span class="pill">~${formatDurationPreview(state.script)} estimated minutes</span><span class="pill">${escapeHtml(state.scriptFormat)}</span><span class="pill">Simulated · RM0</span></div>`:''}<div class="actions">${button(state.script?'Regenerate script':'Generate script',`generateScript()`,state.script?'secondary':'primary',!state.brief?.approved)}${state.script?button('Save script edits','saveScript()','secondary'):''}${state.script?button(state.scriptApproved?'Script approved ✓':'Approve script','approveScript()',state.scriptApproved?'secondary':'primary'):''}</div>${state.scriptVersions?.length?`<h3 class="subhead">Version history</h3><div class="cards">${state.scriptVersions.map((v,i)=>`<article class="scene"><b>Version ${i+1} · ${escapeHtml(v.reason)}</b><p>${new Date(v.createdAt).toLocaleString()}</p><p>${wordCountPreview(v.text)} words</p>${button('Restore version','restoreScriptVersion('+i+')','secondary')}</article>`).join('')}</div>`:''}${state.scriptUsage?.length?`<h3 class="subhead">Generation usage</h3><div class="export">${state.scriptUsage.map(u=>`${escapeHtml(u.provider)} · ${u.inputTokens}+${u.outputTokens} estimated tokens · RM${Number(u.estimatedCostMyr||0).toFixed(4)}`).join('<br>')}</div>`:''}</section>`;break;
case 3:h=head('STEP 04 · APPROVAL GATE','Approve the script','Scene breakdown and image prompt generation remain locked until the current script is approved.');h+=`<section class="panel">${state.script?field('Final script','scriptReview',state.script,'',true):'<div class="empty">Generate a script first.</div>'}${state.script?`<p class="help">${wordCountPreview(state.script)} words · about ${formatDurationPreview(state.script)} minutes · ${escapeHtml(state.scriptFormat)}</p>`:''}<div class="actions">${button('Save script edits','saveScript()','secondary',!state.script)}${button(state.scriptApproved?'Script approved ✓':'Approve final script','approveScript()',state.scriptApproved?'secondary':'primary',!state.script)}</div></section>`;break;
case 4:h=head('STEP 05 · SCENE PLANNING','Break script into scenes','Create editable scene descriptions and visual prompts before image generation.');h+=`<section class="panel"><h2>Scene breakdown</h2><p class="sub">Scenes are simulated from the approved script. Edit each visual prompt.</p>${state.scenes.length?`<div class="cards">${state.scenes.map((s,i)=>`<article class="scene"><span class="tag">SCENE ${i+1} · ${s.seconds}s</span><h3>${s.title}</h3><p>${s.line}</p>${field('Image prompt',`prompt${i}`,s.prompt,'',true)}<div class="field"><label>Characters in this scene</label>${(state.characterIds||[]).map(id=>{const c=entityRecord('characters',id);return c?`<label class="check"><input type="checkbox" data-scene-array="${i}" value="${id}" ${(s.characterIds||[]).includes(id)?'checked':''}> ${escapeHtml(c.name)}</label>`:''}).join('')||'<small>Assign characters in project settings.</small>'}</div><div class="field"><label for="sceneLocation${i}">Scene location</label><select id="sceneLocation${i}"><option value="">Choose later</option>${(state.locationIds||[]).map(id=>{const l=entityRecord('locations',id);return l?`<option value="${id}" ${s.locationId===id?'selected':''}>${escapeHtml(l.name)}</option>`:''}).join('')}</select></div>${field('Scene-specific outfit or appearance',`sceneOutfit${i}`,s.outfitOverride||'','Overrides this project only')}</article>`).join('')}</div>`:'<div class="empty">Approve the script to create scene breakdown.</div>'}<div class="actions">${button(state.scenes.length?'Refresh breakdown':'Generate scene breakdown',`makeScenes()`,state.scenes.length?'secondary':'primary',!state.scriptApproved)}${state.scenes.length?button('Save scene prompts','savePrompts()','secondary'):''}</div></section>`;break;
case 5:h=head('STEP 06 · SIMULATED FLUX','Generate scene images','Image generation is simulated locally. Every scene has a separate demo image card; no image API calls are made.');h+=`<section class="panel"><h2>Scene image boards</h2><p class="sub">Review image concepts before moving to scene approval.</p>${state.scenes.length?`<div class="cards">${state.scenes.map((s,i)=>`<article class="scene"><div class="thumb" style="aspect-ratio:${state.settings.aspectRatio==='9:16'?'9/16':'16/9'};font-size:13px">SCENE ${i+1}<br>${s.title}</div><p>${escapeHtml(s.prompt)}</p>${s.image?`<p class="help">Prompt used: ${escapeHtml(s.imagePromptUsed)}</p>`:''}<span class="pill">${s.image?'Demo image ready':'Not generated'}</span></article>`).join('')}</div>`:'<div class="empty">Generate your scene breakdown first.</div>'}<div class="actions">${button('Generate images for all scenes','makeImages()', 'primary',!state.scenes.length)}</div></section>`;break;
case 6:h=head('STEP 07 · SCENE APPROVAL','Approve each scene image','Approve or regenerate each scene independently. Voice generation unlocks when every scene is approved.');h+=`<section class="panel"><div class="cards">${state.scenes.length?state.scenes.map((s,i)=>`<article class="scene"><div class="thumb" style="aspect-ratio:${state.settings.aspectRatio==='9:16'?'9/16':'16/9'};font-size:13px">${s.image?'SCENE '+(i+1)+' · IMAGE '+s.version:'Generate image first'}</div><h3>${s.title}</h3><p class="help">Image prompt used: ${escapeHtml(s.imagePromptUsed||'Not generated')}</p>${field('Prompt for regeneration',`reviewPrompt${i}`,s.prompt,'Edit prompt before regenerating this scene',true)}<span class="pill ${s.approved?'ok':''}">${s.approved?'Approved':s.image?'Awaiting approval':'Image needed'}</span><div class="actions">${button('Regenerate','regenScene('+i+')','secondary',!s.image)}${button(s.approved?'Approved ✓':'Approve scene','approveScene('+i+')',s.approved?'secondary':'primary',!s.image||s.approved)}</div></article>`).join(''):'<div class="empty">No scenes yet.</div>'}</div></section>`;break;
case 7:h=head('STEP 08 · SIMULATED ELEVENLABS','Voice generation','Voice generation uses a simulated preview. No audio provider is contacted.');h+=`<section class="panel"><h2>Narration voice</h2><p class="sub">Choose a demo voice and generate a placeholder narration track.</p><div class="row"><div class="field"><label for="voice">Voice style</label><select id="voice"><option>Warm, conversational</option><option>Confident, documentary</option><option>Bright, energetic</option></select></div><div class="field"><label for="pace">Pacing</label><select id="pace"><option>Natural</option><option>Measured</option><option>Upbeat</option></select></div></div>${state.voice?'<div class="export">▶ &nbsp; Simulated narration track · '+state.scenes.length+' scenes · ready for timeline</div>':'<div class="empty">Approve every scene before generating narration.</div>'}<div class="actions">${button(state.voice?'Regenerate voice preview':'Generate voice preview','makeVoice()',state.voice?'secondary':'primary',!state.scenes.length||!state.scenes.every(s=>s.approved))}</div></section>`;break;
case 8:h=head('STEP 09 · EDITOR','Video timeline & editing','Arrange scene clips, adjust durations, and review the simulated video sequence.');h+=`<section class="panel"><h2>Timeline</h2><p class="sub">A simple editable timeline prototype. Video rendering is still simulated.</p>${state.scenes.length?`<div class="timeline">${state.scenes.map((s,i)=>`<div class="clip">${i+1}. ${s.title}<small><input aria-label="Scene ${i+1} duration" type="number" id="duration-${i}" min="1" max="120" value="${s.seconds}" onchange="setDuration(${i},this.value)" style="width:45px;background:#111;padding:3px;border:1px solid #444;color:white"> seconds · ${state.voice?'voice':'no voice'}</small></div>`).join('')}</div>`:'<div class="empty">Voice track required to assemble timeline.</div>'}${field('Editor notes','editnotes',state.notes,'Notes for pacing, transitions, and sequence',true)}<div class="actions">${button('Save timeline','saveTimeline()','secondary',!state.voice)}${button('Continue to render','setStep(9)','primary',!state.voice)}</div></section>`;break;
case 9:h=head('STEP 10 · SIMULATED FFMPEG','Render video','FFmpeg rendering is represented by a progress simulation; no server render or cost occurs.');h+=`<section class="panel"><h2>Render settings</h2><div class="row"><div class="field"><label for="resolution">Resolution</label><select id="resolution"><option ${state.renderResolution==='1080p · 16:9'||(!state.renderResolution&&state.settings.aspectRatio==='16:9')?'selected':''}>1080p · 16:9</option><option ${state.renderResolution==='1080p · 9:16'||(!state.renderResolution&&state.settings.aspectRatio==='9:16')?'selected':''}>1080p · 9:16</option></select></div><div class="field"><label for="format">Format</label><select id="format"><option ${state.renderFormat==='MP4 · H.264'?'selected':''}>MP4 · H.264</option><option ${state.renderFormat==='WebM'?'selected':''}>WebM</option></select></div></div><div class="progress"><i style="width:${state.render?'100%':'0%'}"></i></div>${state.render?'<div class="export">✓ Demo render complete · preview only · no downloadable video file generated</div>':'<div class="empty">Check the timeline, then start a simulated render.</div>'}<div class="actions">${button(state.render?'Render again':'Start simulated render','renderVideo()',state.render?'secondary':'primary',!state.voice)}</div></section>`;break;
case 10:h=head('STEP 11 · POST-PRODUCTION','Final checks & finishing','Review the render, add finishing notes, and mark post-production complete.');h+=`<section class="panel"><h2>Post-production checklist</h2><div class="summary"><span class="pill ${state.render?'ok':''}">${state.render?'✓':'○'} Render reviewed</span><span class="pill">○ Captions & titles</span><span class="pill">○ Audio levels</span><span class="pill">○ Final quality check</span></div>${field('Finishing notes','postnotes',state.notes,'What should be adjusted in the final pass?',true)}<div class="actions">${button(state.post?'Post-production complete ✓':'Complete post-production','completePost()',state.post?'secondary':'primary',!state.render)}</div></section>`;break;
case 11:h=head('STEP 12 · THUMBNAIL','Create a video thumbnail','Generate a simulated thumbnail concept and review it before export.');h+=`<section class="panel"><h2>Thumbnail concept</h2>${state.thumb?`<div class="thumb">${escapeHtml(state.thumbnailText||state.brief?.title||'Your video')}<br><small style="font-size:11px;font-weight:400">CCAI · DEMO THUMBNAIL</small></div>`:'<div class="empty">Complete post-production to generate a thumbnail concept.</div>'}${field('Thumbnail text','thumbtext',state.thumbnailText||state.brief?.title||'','Short title shown on thumbnail')}<div class="actions">${button(state.thumb?'Regenerate concept':'Generate thumbnail concept','makeThumb()',state.thumb?'secondary':'primary',!state.post)}</div></section>`;break;
case 12:h=head('STEP 13 · EXPORT','Export your video','The prototype records export settings but does not create a rendered video file.');h+=`<section class="panel"><h2>Export package</h2><div class="summary"><span class="pill">${state.exportResolution||state.renderResolution||'1080p · 16:9'}</span><span class="pill">${state.exportFormat||state.renderFormat||'MP4 · H.264'}</span><span class="pill">Thumbnail ${state.thumb?'ready':'missing'}</span></div>${state.exported?'<div class="export">✓ Export checklist created. Video file generation is not active in this prototype.</div>':'<div class="empty">Export becomes available after post-production and thumbnail review.</div>'}<div class="actions">${button(state.exported?'Export checklist ready ✓':'Prepare export checklist','doExport()',state.exported?'secondary':'primary',!state.post||!state.thumb)}</div><p class="help">Real FFmpeg rendering and file download require a server-side rendering phase.</p></section>`;break;}
view.innerHTML=h;scheduleAutosave()}
function captureIdea(){readFormIntoState();const rawVideos=String(document.querySelector('#referenceVideos')?.value||'').split(/\n/).map(x=>x.trim()).filter(Boolean);if(rawVideos.some(url=>!/^https:\/\//i.test(url))){say('Reference video links must use HTTPS. Remove or correct the invalid link.',true);return}state.idea=document.querySelector('#idea').value.trim();state.reference=document.querySelector('#reference').value.trim();state.referenceText=document.querySelector('#referenceText')?.value.trim()||'';if(!state.idea){say('Please enter an idea before continuing.',true);return}if(state.idea.length>4000){say('Keep the idea under 4,000 characters.',true);return}state.storyContinuity=document.querySelector('#storyContinuity')?.value.trim()||'';const selectedSeries=entityRecord('series',state.seriesId);const continuity=[state.storyContinuity||selectedSeries?.previousEpisodeSummary,selectedSeries?.previousEvents,selectedSeries?.characterDevelopment,selectedSeries?.unresolvedStorylines,selectedSeries?.storyline].filter(Boolean).join(' ');const refs=(state.settings.referenceVideos||[]).filter(url=>/^https:\/\//i.test(url)),imageRefs=(state.settings.referenceImages||[]).map(image=>`${image.category}: ${image.name}`).join(', ');state.brief={title:state.idea.slice(0,120),direction:`A concise, visually engaging ${state.settings.durationMinutes}-minute ${state.settings.visualStyle} video in ${state.settings.language}, exploring: ${state.idea}. ${state.reference?`Reference notes: ${state.reference}.`:''} ${state.referenceText?`Reference transcript/context: ${state.referenceText}.`:''} ${continuity?`Series and episode continuity: ${continuity}.`:''} ${state.appliedChannelProfile?.targetAudience?`Target audience: ${state.appliedChannelProfile.targetAudience}.`:''} ${state.appliedChannelProfile?.contentCategory?`Content category: ${state.appliedChannelProfile.contentCategory}.`:''} ${state.appliedChannelProfile?.storytellingPreferences?`Storytelling preferences: ${state.appliedChannelProfile.storytellingPreferences}.`:''} ${entityRecord('brandKits',state.brandKitId)?.visualGuidelines?`Brand visual guidelines: ${entityRecord('brandKits',state.brandKitId).visualGuidelines}.`:''} ${imageRefs?`Image reference cues: ${imageRefs}.`:''} ${refs.length?`${refs.length} reference video link(s) supplied; remote content is not fetched automatically.`:''} Aspect ratio: ${state.settings.aspectRatio}.`,goal:'Audience: curious viewers. Goal: deliver a clear, memorable takeaway.',audience:'Curious viewers',duration:state.settings.durationMinutes*60,durationMinutes:state.settings.durationMinutes,tone:'Warm and clear',language:state.settings.language,visualStyle:state.settings.visualStyle,aspectRatio:state.settings.aspectRatio,approved:false};say('Simulated creative brief drafted. Review and approve it before script generation.');setStep(1)}
function resetAfterBrief(){state.script='';state.scriptSavedText='';state.scriptVersions=[];state.scriptUsage=[];state.scriptApproved=false;resetAfterScript()}
function invalidateSceneVisual(index){const scene=state.scenes[index];if(!scene)return;scene.image=false;scene.approved=false;scene.imagePromptUsed='';state.voice=false;state.render=false;state.post=false;state.thumb=false;state.exported=false}
function resetAfterScript(){state.scenes=[];state.voice=false;state.render=false;state.post=false;state.thumb=false;state.thumbnailText='';state.exported=false;state.notes='';state.exportResolution='';state.exportFormat=''}
function readBrief(){return{title:document.querySelector('#btitle')?.value??state.brief.title,direction:document.querySelector('#bdirection')?.value??state.brief.direction,goal:document.querySelector('#baud')?.value??state.brief.goal}}
function saveBrief(){const next=readBrief();if(!next.title.trim()){say('A working title is required.',true);return}const changed=Object.keys(next).some(k=>next[k]!==state.brief[k]);Object.assign(state.brief,next);if(changed){state.brief.approved=false;resetAfterBrief()}say(changed?'Brief edits saved. Approval was reset and dependent work cleared.':'Brief edits saved locally.');draw()}
function approveBrief(){const next=readBrief();if(!next.title.trim()){say('A working title is required.',true);return}const changed=Object.keys(next).some(k=>next[k]!==state.brief[k]);Object.assign(state.brief,next);if(changed)resetAfterBrief();state.brief.approved=true;say('Creative brief approved. Script generation is unlocked.');draw()}
function wordCountPreview(text){const value=String(text||'').trim();if(!value)return 0;const locale={English:'en',Malay:'ms',Chinese:'zh',Tamil:'ta',Spanish:'es',French:'fr',Japanese:'ja',Arabic:'ar'}[state.settings.language]||'en';if(typeof Intl.Segmenter==='function')return Array.from(new Intl.Segmenter(locale,{granularity:'word'}).segment(value)).filter(part=>part.isWordLike).length;return value.split(/\s+/u).length}
function formatDurationPreview(text){return Math.max(1,Math.round(wordCountPreview(text)/140*10)/10)}
function localizedScript(language){const packs={English:["Here is a story worth exploring.","Start with a question viewers recognize. What is changing, and why does it matter to the people in this story?","Show a specific human moment. Describe the setting, introduce the people, and make the central idea clear.","Explain the challenge and show a practical response. Use concrete details, a clear example, and a natural transition so each scene adds something new.","A small, thoughtful step can change what happens next. Connect the idea to an insight viewers can remember and share.","The takeaway is simple: understand the need, choose a useful next step, and keep the human story at the center.","What will you create next? Thanks for watching.",["Look closely at the people involved. What did they notice first? What felt uncertain, and what helped them choose a direction? Show those details clearly, then connect the moment to the larger idea.","Make the next beat concrete. Walk through a practical example, explain what changed, and name the trade-off honestly. Keep the action visible and the language simple.","Pause for a human detail that gives the story texture. Include a small decision, an unexpected obstacle, or a useful conversation, then link it back to the central question."],"What does this look like in practice? It starts by noticing the details and making one clear choice."] ,Malay:["Inilah kisah yang wajar kita terokai.","Mulakan dengan soalan yang mudah difahami. Apakah yang sedang berubah, dan mengapa hal ini penting kepada mereka dalam kisah ini?","Tunjukkan detik manusia yang khusus. Gambarkan latar, kenalkan watak, dan jelaskan idea utama.","Terangkan cabaran dan tunjukkan tindak balas yang praktikal. Gunakan butiran nyata, contoh yang jelas, dan peralihan semula jadi.","Satu langkah kecil yang teliti boleh mengubah apa yang berlaku seterusnya. Hubungkan idea ini dengan pandangan yang mudah diingati.","Kesimpulannya mudah: fahami keperluan, pilih langkah seterusnya yang berguna, dan utamakan kisah manusia.","Apakah yang akan anda hasilkan selepas ini? Terima kasih kerana menonton.",["Perhatikan orang yang terlibat. Apakah yang mereka sedari dahulu? Apakah yang tidak pasti, dan maklumat apakah yang membantu mereka memilih arah? Hubungkan detik itu dengan idea utama.","Jadikan babak seterusnya lebih nyata. Berikan contoh praktikal, terangkan perubahan, dan nyatakan pertimbangannya dengan jujur.","Berhenti seketika pada butiran manusia yang memberi warna kepada kisah ini. Tunjukkan keputusan kecil, halangan yang tidak dijangka, atau perbualan yang berguna."],"Bagaimanakah perkara ini berlaku dalam kehidupan sebenar? Semuanya bermula dengan memerhatikan butiran dan membuat satu pilihan yang jelas."] ,Chinese:["這是一個值得深入探索的故事。","先從觀眾熟悉的問題開始。正在發生什麼變化？為什麼這對故事中的人很重要？","呈現一個具體的人物時刻。描寫場景、介紹人物，並清楚說明核心想法。","說明挑戰並展示實際的回應。加入具體細節、清楚的例子和自然的轉場。","一個用心的小步驟也能改變接下來的發展。把這個想法連結到觀眾能記住的洞見。","重點很簡單：了解需求、選擇有用的下一步，並讓人的故事成為核心。","接下來你想創作什麼？感謝收看。",["仔細觀察故事中的人。他們最先注意到什麼？哪些事情仍不確定？什麼資訊幫助他們選擇方向？把這個時刻連結到更大的想法。","讓下一段更具體。說明一個實際例子、發生的變化，以及其中的取捨。讓行動清楚可見，語言保持簡單。","停留在一個能呈現故事質感的人物細節。加入一個小決定、意外障礙或有意義的對話。"],"這在實際生活中是什麼樣子？從觀察細節並做出清楚選擇開始。"] ,Tamil:["இந்தக் கதையை ஆராய்வது பயனுள்ளதாக இருக்கும்.","பார்வையாளர்கள் அறிந்த கேள்வியுடன் தொடங்குங்கள். என்ன மாறுகிறது, இந்தக் கதையில் உள்ளவர்களுக்கு அது ஏன் முக்கியம்?","ஒரு மனித தருணத்தைத் தெளிவாகக் காட்டுங்கள். இடத்தை விவரித்து, கதாபாத்திரங்களை அறிமுகப்படுத்தி, மையக் கருத்தை விளக்குங்கள்.","சவாலை விளக்கி நடைமுறைத் தீர்வைக் காட்டுங்கள். குறிப்பான விவரங்களையும் தெளிவான எடுத்துக்காட்டையும் பயன்படுத்துங்கள்.","சிறிய கவனமான ஒரு படி அடுத்த நிகழ்வை மாற்றலாம். நினைவில் நிற்கும் கருத்துடன் இதை இணைக்கவும்.","முக்கியம் எளிது: தேவையைப் புரிந்து, பயனுள்ள அடுத்த படியைத் தேர்ந்து, மனிதக் கதையை மையமாக வையுங்கள்.","அடுத்து நீங்கள் என்ன உருவாக்கப் போகிறீர்கள்? பார்த்ததற்கு நன்றி.",["சம்பந்தப்பட்டவர்களை நெருக்கமாகப் பாருங்கள். முதலில் அவர்கள் என்ன கவனித்தார்கள்? எது தெளிவாக இல்லை? அவர்கள் முடிவெடுக்க எந்தத் தகவல் உதவியது?","அடுத்த பகுதியை குறிப்பாகக் காட்டுங்கள். நடைமுறை எடுத்துக்காட்டையும் ஏற்பட்ட மாற்றத்தையும் நேர்மையாக விளக்குங்கள்.","கதைக்கு உயிர் தரும் மனித விவரத்தில் சிறிது தங்குங்கள். ஒரு சிறிய முடிவு, எதிர்பாராத தடையாகவோ பயனுள்ள உரையாடலாகவோ இருக்கலாம்."],"இது நடைமுறையில் எப்படி இருக்கும்? விவரங்களைக் கவனித்து தெளிவான தேர்வு செய்வதில் தொடங்குகிறது."] ,Spanish:["Esta es una historia que merece explorarse.","Empieza con una pregunta cercana al público. ¿Qué está cambiando y por qué importa a las personas de esta historia?","Muestra un momento humano concreto. Describe el lugar, presenta a las personas y aclara la idea central.","Explica el reto y muestra una respuesta práctica. Usa detalles concretos, un ejemplo claro y transiciones naturales.","Un pequeño paso consciente puede cambiar lo que sucede después. Conecta la idea con una reflexión memorable.","La idea clave es sencilla: entiende la necesidad, elige un siguiente paso útil y mantén la historia humana en el centro.","¿Qué crearás ahora? Gracias por acompañarnos.",["Observa de cerca a las personas. ¿Qué notaron primero? ¿Qué seguía siendo incierto? ¿Qué información les ayudó a elegir? Conecta ese momento con la idea principal.","Haz concreta la siguiente parte. Presenta un ejemplo práctico, explica el cambio y nombra las decisiones con honestidad.","Detente en un detalle humano que dé textura a la historia. Incluye una decisión pequeña, un obstáculo inesperado o una conversación útil."],"¿Cómo se ve esto en la práctica? Empieza por observar los detalles y tomar una decisión clara."] ,French:["Voici une histoire qui mérite d’être explorée.","Commencez par une question familière. Qu’est-ce qui change et pourquoi cela compte-t-il pour les personnes de cette histoire ?","Montrez un moment humain précis. Décrivez le lieu, présentez les personnes et clarifiez l’idée centrale.","Expliquez le défi et montrez une réponse pratique. Utilisez des détails concrets, un exemple clair et des transitions naturelles.","Un petit geste réfléchi peut changer la suite. Reliez cette idée à un enseignement mémorable.","L’essentiel est simple : comprendre le besoin, choisir une prochaine étape utile et garder l’histoire humaine au cœur du récit.","Que créerez-vous ensuite ? Merci d’avoir regardé.",["Observez les personnes de près. Qu’ont-elles remarqué en premier ? Qu’est-ce qui restait incertain ? Quelles informations les ont aidées à choisir ? Reliez ce moment à l’idée générale.","Rendez la scène suivante concrète. Présentez un exemple pratique, expliquez le changement et nommez honnêtement les compromis.","Arrêtez-vous sur un détail humain qui donne du relief au récit. Incluez une petite décision, un obstacle inattendu ou une conversation utile."],"À quoi cela ressemble-t-il concrètement ? Tout commence en observant les détails et en faisant un choix clair."] ,Japanese:["掘り下げる価値のある物語です。","視聴者になじみのある問いから始めましょう。何が変わりつつあり、物語の人々にとってなぜ大切なのでしょうか。","具体的な人の瞬間を見せましょう。場所を描き、人々を紹介し、中心となる考えを明確にします。","課題を説明し、実用的な対応を示しましょう。具体的な詳細とわかりやすい例を自然につなげます。","小さくても思慮深い一歩が、その後を変えることがあります。覚えやすい気づきに結びつけます。","要点はシンプルです。必要なことを理解し、有用な次の一歩を選び、人の物語を中心に置きます。","次は何を作りますか。ご覧いただきありがとうございました。",["登場する人々をよく見てください。最初に気づいたことは何でしょう。何が不確かで、どんな情報が選択を助けましたか。その瞬間を大きなテーマにつなげます。","次の場面を具体的にしましょう。実例を示し、変化を説明し、選択の利点と課題を正直に伝えます。","物語に深みを与える人間らしい細部に目を向けます。小さな決断、予想外の障害、役立つ会話を入れましょう。"],"実際にはどのような姿でしょうか。細部に気づき、明確な選択をすることから始まります。"] ,Arabic:["هذه قصة تستحق الاستكشاف.","ابدأ بسؤال يعرفه المشاهدون. ما الذي يتغير، ولماذا يهم ذلك الأشخاص في هذه القصة؟","اعرض لحظة إنسانية محددة. صِف المكان، وقدّم الأشخاص، ووضّح الفكرة الأساسية.","اشرح التحدي واعرض استجابة عملية. استخدم تفاصيل واضحة ومثالاً محدداً وانتقالات طبيعية.","قد تغيّر خطوة صغيرة ومدروسة ما يحدث لاحقاً. اربط الفكرة بخلاصة يسهل تذكرها.","الخلاصة بسيطة: افهم الحاجة، واختر خطوة تالية مفيدة، واجعل القصة الإنسانية في قلب العمل.","ما الذي ستبدعه بعد ذلك؟ شكراً للمشاهدة.",["تأمل الأشخاص عن قرب. ما أول ما لاحظوه؟ ما الذي ظل غير واضح؟ وما المعلومات التي ساعدتهم على الاختيار؟ اربط تلك اللحظة بالفكرة الأوسع.","اجعل المشهد التالي ملموساً. قدّم مثالاً عملياً، واشرح ما تغيّر، واذكر المفاضلات بصدق.","توقف عند تفصيل إنساني يمنح القصة عمقاً. أضف قراراً صغيراً أو عقبة غير متوقعة أو حواراً مفيداً."],"كيف يبدو ذلك عملياً؟ يبدأ بملاحظة التفاصيل واتخاذ خيار واضح."]};return packs[language]||packs.English}
function generateScript(){
 if(!state.brief?.approved){say('Approve the creative brief before generating a script.',true);return}
 const format=document.querySelector('#scriptFormat')?.value||state.scriptFormat||'narration';state.scriptFormat=format;
 const minutes=Number(state.settings.durationMinutes)||1,localized=localizedScript(state.settings.language),label=format==='dialogue'?'[HOST]':'[NARRATOR]',guest=format==='dialogue'?'[GUEST]':label;
 const ref=state.referenceText?` Reference context: ${state.referenceText}.`:state.reference?` Reference context: ${state.reference}.`:'';
 const topic=state.idea||state.brief.title,close=`[CLOSE — ${minutes}:00]\n${label} ${localized[6]}`;
 const blocks=[`[OPEN — 0:00]\n${label} ${localized[0]} ${state.brief.title}: ${topic}.${ref}`,`[SETUP]\n${label} ${localized[1]}`,`[STORY]\n${guest} ${localized[2]} ${state.settings.visualStyle} imagery can support this beat without distracting from the story.`,`[DEVELOPMENT]\n${label} ${localized[3]}`,`[TURNING POINT]\n${guest} ${localized[4]}`,`[TAKEAWAY]\n${label} ${localized[5]}`];
 if(format==='mixed')blocks.splice(3,0,`[DIALOGUE]\n[HOST] ${localized[8]}`);
 blocks.push(close);const expansions=localized[7],targetWords=minutes*125;let cursor=0;
 while(wordCountPreview(blocks.join('\n\n'))<targetWords&&cursor<24){blocks.splice(blocks.length-1,0,`[DETAIL ${cursor+1}]\n${cursor%2?guest:label} ${expansions[cursor%expansions.length]}`);cursor++}
 if(state.script&&state.scriptSavedText&&state.script!==state.scriptSavedText)state.scriptVersions=appendVersionPreview(state.scriptVersions,state.script,'edited');
 state.script=blocks.join('\n\n');state.scriptSavedText=state.script;state.scriptVersions=appendVersionPreview(state.scriptVersions,state.script,'generated');state.scriptApproved=false;resetAfterScript();state.scriptUsage=state.scriptUsage||[];
 state.scriptUsage.push({provider:'Simulated',inputTokens:Math.ceil((state.idea.length+state.reference.length+state.referenceText.length)/4),outputTokens:Math.ceil(state.script.length/4),estimatedCostMyr:0,createdAt:new Date().toISOString()});
 say(`Simulated ${format} script generated in ${state.settings.language} for ${minutes} minute(s). Estimated API cost: RM0. Edit and save, then approve.`);setStep(2)
}
function appendVersionPreview(list,text,reason){if(!text?.trim())return list||[];const next=[...(list||[]),{id:'v'+((list||[]).length+1),text:text.trim(),createdAt:new Date().toISOString(),reason}];return next.slice(-50)}
function saveScript(){const next=document.querySelector('#scriptReview')?.value??document.querySelector('#script')?.value??state.script;if(!next.trim()){say('The script cannot be empty.',true);return}const changed=next!==state.scriptSavedText;if(changed){state.scriptVersions=appendVersionPreview(state.scriptVersions,next,'edited');state.script=next;state.scriptSavedText=next;state.scriptApproved=false;resetAfterScript()}say(changed?'Script edits saved as a new version. Approval was reset and dependent scenes were cleared.':'Script edits saved.');draw()}
function restoreScriptVersion(index){const version=state.scriptVersions?.[index];if(!version)return;if(state.script&&state.script!==state.scriptSavedText)state.scriptVersions=appendVersionPreview(state.scriptVersions,state.script,'edited');state.script=version.text;state.scriptSavedText=version.text;state.scriptVersions=appendVersionPreview(state.scriptVersions,state.script,'restored');state.scriptApproved=false;resetAfterScript();say('Version restored. Script approval and dependent work were reset.');draw()}
function approveScript(){const next=document.querySelector('#scriptReview')?.value??document.querySelector('#script')?.value??state.script;if(!next.trim()){say('The script cannot be empty.',true);return}if(next!==state.scriptSavedText){state.scriptVersions=appendVersionPreview(state.scriptVersions,next,'edited');state.script=next;state.scriptSavedText=next;resetAfterScript()}state.scriptApproved=true;say('Script approved. Scene breakdown is unlocked.');draw()}
function makeScenes(){if(!state.scriptApproved)return;resetAfterScript();state.scenes=[{title:'The opening image',line:'Introduce the idea with a specific, human moment.',prompt:'Cinematic close-up establishing the story, soft natural light, thoughtful composition, premium documentary aesthetic.',seconds:8,approved:false,image:false,version:0,imagePromptUsed:'',characterIds:[...(state.characterIds||[])],locationId:state.locationIds?.[0]||'',outfitOverride:''},{title:'The key detail',line:'Show the detail that brings the idea to life.',prompt:'Medium shot illustrating the central idea with authentic textures, balanced negative space, editorial film still.',seconds:12,approved:false,image:false,version:0,imagePromptUsed:'',characterIds:[...(state.characterIds||[])],locationId:state.locationIds?.[0]||'',outfitOverride:''},{title:'The turning point',line:'Reveal a small change or discovery.',prompt:'A subtle moment of transformation, warm directional light, genuine expression, cinematic depth of field.',seconds:12,approved:false,image:false,version:0,imagePromptUsed:'',characterIds:[...(state.characterIds||[])],locationId:state.locationIds?.[0]||'',outfitOverride:''},{title:'The takeaway',line:'Close on a clear action or memorable image.',prompt:'Wide closing shot with room for a short title, calm optimistic mood, polished brand film still.',seconds:8,approved:false,image:false,version:0,imagePromptUsed:'',characterIds:[...(state.characterIds||[])],locationId:state.locationIds?.[0]||'',outfitOverride:''}];state.scenes.forEach(scene=>{const cast=(scene.characterIds||[]).map(id=>entityRecord('characters',id)).filter(Boolean);const place=entityRecord('locations',scene.locationId);if(cast.length)scene.prompt+=` Character continuity: ${cast.map(c=>`${c.name} (${c.appearance||'match reference images'}; ${c.distinguishingFeatures||'keep distinguishing details consistent'}; reference images: ${(c.referenceImages||[]).map(img=>img.name).join(', ')||'none'}; ${state.appearanceOverrides?.[c.id]||c.clothing||''}; scene outfit: ${scene.outfitOverride||'project default'}).`).join(' ')}`;if(place)scene.prompt+=` Location continuity: ${place.name} (${place.description||place.environment||''}; ${place.lighting||''}; ${place.visualStyle||''}; reference images: ${(place.referenceImages||[]).map(img=>img.name).join(', ')||'none'}).`});say('Four editable scene cards created from the approved script.');draw()}
function savePrompts(){const prompts=state.scenes.map((_,i)=>document.querySelector('#prompt'+i).value.trim());if(prompts.some(p=>!p)){say('Every scene needs an image prompt.',true);return}let changed=0;prompts.forEach((next,i)=>{const scene=state.scenes[i];if(next!==scene.prompt){scene.prompt=next;scene.image=false;scene.approved=false;scene.imagePromptUsed='';changed++}});say(changed?changed+' edited prompt'+(changed===1?'':'s')+' saved; outdated scene images were unapproved.':'Scene prompts saved. Image generation is ready.');draw()}
function makeImages(){const pending=state.scenes.filter(s=>!s.image);if(pending.some(s=>!s.prompt.trim())){say('Every scene needs an image prompt.',true);return}pending.forEach(s=>{s.image=true;s.version++;s.approved=false;s.imagePromptUsed=s.prompt});say(pending.length?`Generated ${pending.length} simulated scene image${pending.length===1?'':'s'}; existing images were preserved.`:'All scene images already exist; nothing was regenerated.');setStep(5)}
function regenScene(i){const s=state.scenes[i];const edited=document.querySelector('#reviewPrompt'+i)?.value.trim();if(!edited){say('A scene image prompt cannot be empty.',true);return}if(edited!==s.prompt)s.prompt=edited;s.imagePromptUsed=s.prompt;s.version++;s.image=true;s.approved=false;say('Scene '+(i+1)+' regenerated using its current prompt; approval is required again.');draw()}
function approveScene(i){state.scenes[i].approved=true;say('Scene '+(i+1)+' approved.');draw()}
function makeVoice(){state.voice=true;say('Simulated narration preview created. Continue to the timeline.');draw()}
function setDuration(i,v){state.scenes[i].seconds=Math.min(120,Math.max(1,Number(v)||1))}
function saveTimeline(){state.notes=document.querySelector('#editnotes').value;state.scenes.forEach((scene,i)=>{const raw=Number(document.querySelector(`[aria-label="Scene ${i+1} duration"]`)?.value);if(Number.isFinite(raw)&&raw!==0)scene.seconds=Math.min(120,Math.max(1,raw));else if(raw===0)scene.seconds=1});say('Timeline edits saved locally; scene durations are limited to 1–120 seconds.');draw()}
function renderVideo(){state.renderResolution=document.querySelector('#resolution')?.value||'1080p · 16:9';state.renderFormat=document.querySelector('#format')?.value||'MP4 · H.264';state.exported=false;state.exportResolution='';state.exportFormat='';state.render=true;say('Simulated render complete. No video file or external API call was created.');draw()}
function completePost(){state.notes=document.querySelector('#postnotes').value;state.post=true;say('Post-production checklist marked complete.');draw()}
function makeThumb(){state.thumbnailText=document.querySelector('#thumbtext')?.value.trim()||state.brief?.title||'Your video';state.thumb=true;say('Simulated thumbnail concept created.');draw()}
function doExport(){state.exportResolution=state.renderResolution||'1080p · 16:9';state.exportFormat=state.renderFormat||'MP4 · H.264';state.exported=true;say('Export checklist prepared. Actual video rendering and file export are not enabled in this prototype.');draw()}
function projectContextFields(){const choices=(items,selected,label,key)=>`<div class="field"><label for="${key}">${label}</label><select id="${key}"><option value="">None</option>${items.map(item=>`<option value="${item.id}" ${selected===item.id?'selected':''}>${escapeHtml(item.name)}</option>`).join('')}</select></div>`;const series=entityRecord('series',state.seriesId);return `<section class="panel settings-panel"><h2>Project continuity and assignments</h2><p class="sub">Reusable profiles are copied by reference; project-specific notes never change the original library item.</p><div class="row">${choices(libraryData.series,state.seriesId,'Series','seriesId')}${choices(libraryData.channels,state.channelId,'Channel profile','channelId')}${choices(libraryData.brandKits,state.brandKitId,'Brand kit','brandKitId')}</div><div class="row"><div class="field"><label for="season">Season (for series)</label><input id="season" type="number" min="1" value="${Number(state.season||1)}"></div><div class="field"><label for="episode">Episode</label><input id="episode" type="number" min="1" value="${Number(state.episode||1)}"></div></div><div class="row"><div class="field"><label>Assign characters</label>${libraryData.characters.map(item=>`<label class="check"><input type="checkbox" data-project-array="characterIds" value="${item.id}" ${state.characterIds?.includes(item.id)?'checked':''}> ${escapeHtml(item.name)}</label>`).join('')||'<small>Create characters in the dashboard library first.</small>'}</div><div class="field"><label>Assign locations</label>${libraryData.locations.map(item=>`<label class="check"><input type="checkbox" data-project-array="locationIds" value="${item.id}" ${state.locationIds?.includes(item.id)?'checked':''}> ${escapeHtml(item.name)}</label>`).join('')||'<small>Create locations in the dashboard library first.</small>'}</div></div>${state.characterIds?.length?field('Project-specific appearance or outfit changes (JSON by character ID)','appearanceOverrides',JSON.stringify(state.appearanceOverrides||{},null,2),'e.g. {"character-id":"blue jacket"}',true):''}${field('Continuity notes for this episode','storyContinuity',state.storyContinuity||series?.previousEpisodeSummary||'','Previous events, character arcs, unresolved threads, or episode context',true)}<p class="help">Series continuity notes are included as reference context when you prepare a creative brief. No content is generated automatically.</p></section>`}
function projectSettingsFields(){const settings=state.settings||{};const imageCards=(settings.referenceImages||[]).map((image,index)=>`<div class="reference-chip"><img src="${image.dataUrl}" alt="${escapeHtml(image.name)}"><span>${escapeHtml(image.name)} · ${escapeHtml(image.category)}</span><button class="text-button" type="button" onclick="removeReferenceImage(${index})" aria-label="Remove ${escapeHtml(image.name)}">Remove</button></div>`).join('');return `<div class="panel settings-panel"><h2>Video settings</h2><p class="sub">Set the format and creative direction before drafting the brief.</p><div class="row"><div class="field"><label for="durationMinutes">Video duration</label><select id="durationMinutes">${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(settings.durationMinutes)===n?'selected':''}>${n} minute${n>1?'s':''}</option>`).join('')}</select></div><div class="field"><label for="aspectRatio">Aspect ratio</label><select id="aspectRatio"><option value="16:9" ${settings.aspectRatio==='16:9'?'selected':''}>16:9 · Landscape</option><option value="9:16" ${settings.aspectRatio==='9:16'?'selected':''}>9:16 · Portrait</option></select></div></div><div class="row"><div class="field"><label for="language">Language</label><select id="language">${['English','Malay','Chinese','Tamil','Spanish','French','Japanese','Arabic'].map(x=>`<option ${settings.language===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="visualStyle">Visual style</label><select id="visualStyle">${['Cinematic documentary','Editorial film still','Warm lifestyle','Minimal studio','Hand-drawn illustration','Bold graphic'].map(x=>`<option ${settings.visualStyle===x?'selected':''}>${x}</option>`).join('')}</select></div></div><h3 class="subhead">Reference images</h3><p class="sub">Add multiple images for characters, backgrounds, and storyboard inspiration. Images are saved with this project in the current storage mode.</p><div class="upload-grid">${[['character','Character references'],['background','Background references'],['storyboard','Storyboard references']].map(([cat,label])=>`<label class="upload-card"><span>＋</span><b>${label}</b><small>Select multiple image files</small><input type="file" data-category="${cat}" accept="image/png,image/jpeg,image/webp,image/gif" multiple></label>`).join('')}</div>${imageCards?`<div class="reference-list">${imageCards}</div>`:''}<h3 class="subhead">Reference video URLs</h3>${field('One HTTPS video link per line','referenceVideos',(settings.referenceVideos||[]).join('\n'),'https://example.com/reference-video',true)}<p class="help">Reference video files are not uploaded. Links are stored with this project.</p></div>`}
function stageSummary(payload){const step=Number(payload?.step||0);return step===0?'Idea':step===1?'Brief':step<4?'Script':step<7?'Scenes':step<9?'Voice & timeline':step<11?'Render & finishing':step<13?'Thumbnail':'Export'}
function renderDashboard(){document.body.classList.add('dashboard-mode');document.querySelector('#activeProjectName').textContent='Project dashboard';document.querySelector('#themeToggle').textContent=document.documentElement.dataset.theme==='light'?'◐ Dark mode':'☼ Light mode';const cards=projectList.map(p=>`<article class="project-card"><div class="project-card-top"><span class="project-icon">▶</span><span class="state-chip">Updated ${new Date(p.updatedAt).toLocaleDateString()}</span></div>${editingProjectId===p.id?`<label class="field">Project name<input id="rename-${p.id}" maxlength="120" value="${escapeHtml(p.title)}"></label><div class="actions"><button class="primary" onclick="saveProjectTitle('${p.id}')">Save name</button><button class="secondary" onclick="editingProjectId=null;draw()">Cancel</button></div>`:`<h2>${escapeHtml(p.title)}</h2><p class="project-stage">${escapeHtml(p.stage||'Project')} · autosaved</p><div class="project-actions"><button class="primary" onclick="openProject('${p.id}')">Open project</button><button class="secondary" onclick="editingProjectId='${p.id}';draw()" aria-label="Edit ${escapeHtml(p.title)}">Edit</button><button class="secondary" onclick="duplicateProject('${p.id}')" aria-label="Duplicate ${escapeHtml(p.title)}">Duplicate</button><button class="danger" onclick="deleteProjectAction('${p.id}')" aria-label="Delete ${escapeHtml(p.title)}">Delete</button></div>`}</article>`).join('');view.innerHTML=`<div class="dashboard-heading"><div><div class="eyebrow">YOUR WORKSPACE</div><h1>Video projects</h1><p>Plan and create videos from one approval-gated workspace.</p></div><button class="primary new-project-button" onclick="creatingProject=!creatingProject;editingProjectId=null;draw()">＋ New project</button></div><div class="dashboard-stats"><div><strong>${projectList.length}</strong><span>Total projects</span></div><div><strong>${projectList.filter(p=>Date.now()-Date.parse(p.updatedAt)<7*86400000).length}</strong><span>Updated this week</span></div><div><strong>13</strong><span>Production stages</span></div></div>${creatingProject?`<section class="panel create-project"><h2>Create a project</h2><p class="sub">Start with a project name. You can set duration, format, references, and creative direction in the workspace.</p><label class="field" for="newProjectTitle">Project name<input id="newProjectTitle" maxlength="120" placeholder="e.g. Spring brand story"></label><div class="actions"><button class="primary" onclick="createProjectAction()">Create project</button><button class="secondary" onclick="creatingProject=false;draw()">Cancel</button></div></section>`:''}<div class="projects-grid">${cards||`<div class="empty dashboard-empty"><strong>No projects yet</strong><br>Create a video project to open the production workspace.</div>`}</div><p class="help storage-note">${browserStorage?'Project details and workflow progress are stored in browser-local storage on this device.':'Project details and workflow progress are saved in SQLite on this app server.'} AI output remains simulated.</p>`}
function loadBrowserProjects(){try{const value=JSON.parse(localStorage.getItem(BROWSER_PROJECTS_KEY)||'[]');return Array.isArray(value)?value:[]}catch{return[]}}
function saveBrowserProjects(projects){try{localStorage.setItem(BROWSER_PROJECTS_KEY,JSON.stringify(projects))}catch(error){say('Browser storage is full or unavailable. Remove a reference image or use fewer projects.',true);throw error}}
function setStorageMode(local){browserStorage=local;const label=document.querySelector('#storageLabel'),description=document.querySelector('#storageDescription');if(label)label.textContent=local?'Browser storage':'SQLite storage';if(description)description.textContent=local?'Projects stay in this browser on this device.':'Projects autosave to this app\'s SQLite database.'}
function projectPayload(){const {projectId,projectTitle,dashboard,...payload}=state;return payload}
function localProjectSummary(project){return{...project,stage:stageSummary(project.payload||{})}}
function storeBrowserProject(project){const projects=loadBrowserProjects();const index=projects.findIndex(item=>item.id===project.id);if(index<0)projects.unshift(project);else projects[index]=project;saveBrowserProjects(projects);projectList=projects.map(localProjectSummary)}
function makeProjectId(){return crypto.randomUUID?crypto.randomUUID():'ccai-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9)}
async function refreshProjectList(){if(browserStorage){projectList=loadBrowserProjects().map(localProjectSummary);setStorageMode(true);return true}try{const response=await fetch('/api/projects');const result=await response.json();if(!response.ok)throw new Error(result.error||'Could not load projects');projectList=result.projects.map(p=>({...p,stage:stageSummary({step:p.step}),status:p.status,priority:p.priority,seriesId:p.seriesId,channelId:p.channelId,brandKitId:p.brandKitId}));setStorageMode(false);return true}catch(error){setStorageMode(true);projectList=loadBrowserProjects().map(localProjectSummary);say('Static preview: projects will save in this browser on this device.');return true}}
async function saveProjectRecord(id,title,payload){if(browserStorage){const record=loadBrowserProjects().find(item=>item.id===id);if(record){record.title=title;record.payload=payload;record.updatedAt=new Date().toISOString();storeBrowserProject(record);notice.textContent='Saved in this browser';notice.className='notice'}return}try{const response=await fetch('/api/projects/'+encodeURIComponent(id),{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({title,payload})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Autosave failed');const item=projectList.find(p=>p.id===id);if(item)item.updatedAt=result.project.updatedAt;notice.textContent='All changes saved';notice.className='notice'}catch(error){setStorageMode(true);storeBrowserProject({id,title,payload,updatedAt:new Date().toISOString()});say('Server storage is unavailable. Changes are saved in this browser on this device.',true)}}
function scheduleAutosave(){if(!state.projectId||state.dashboard)return;const version=++autosaveVersion;clearTimeout(autosaveTimer);autosaveTimer=setTimeout(()=>{const payload=projectPayload(),title=state.projectTitle;autosaveChain=autosaveChain.then(async()=>{if(version!==autosaveVersion)return;await saveProjectRecord(state.projectId,title,payload)})},350)}
async function createProjectAction(){const title=document.querySelector('#newProjectTitle')?.value.trim();if(!title){say('Enter a project name to continue.',true);return}const draft=initialState(title);draft.dashboard=false;draft.priority=3;draft.projectStatus='Draft';draft.channelId=document.querySelector('#newProjectChannel')?.value||'';const profile=entityRecord('channels',draft.channelId);if(profile){draft.settings.language=profile.language||draft.settings.language;draft.settings.durationMinutes=Number(profile.durationMinutes||draft.settings.durationMinutes);draft.settings.aspectRatio=profile.aspectRatio||draft.settings.aspectRatio;draft.settings.visualStyle=profile.visualStyle||draft.settings.visualStyle;draft.appliedChannelProfile={targetAudience:profile.targetAudience||'',contentCategory:profile.contentCategory||'',storytellingPreferences:profile.storytellingPreferences||''}}const payload=(()=>{const {projectId,projectTitle,dashboard,...rest}=draft;return rest})();if(browserStorage){const id=makeProjectId();storeBrowserProject({id,title,payload,updatedAt:new Date().toISOString()});Object.assign(state,draft,{projectId:id,projectTitle:title,dashboard:false});creatingProject=false;say('Project created. Changes save in this browser on this device.');draw();return}try{const response=await fetch('/api/projects',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title,payload})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Create failed');Object.assign(state,draft,{projectId:result.project.id,projectTitle:title,dashboard:false});creatingProject=false;await refreshProjectList();say('Project created. Changes will autosave.');draw()}catch(error){setStorageMode(true);const id=makeProjectId();storeBrowserProject({id,title,payload,updatedAt:new Date().toISOString()});Object.assign(state,draft,{projectId:id,projectTitle:title,dashboard:false});creatingProject=false;say('Project created in browser storage. Data stays on this device.',true);draw()}}
async function openProject(id){if(browserStorage){const project=loadBrowserProjects().find(item=>item.id===id);if(!project){say('Could not find this saved project in browser storage.',true);return}const fresh=initialState(project.title);Object.assign(state,fresh,project.payload,{projectId:id,projectTitle:project.title,dashboard:false,settings:{...fresh.settings,...(project.payload.settings||{})}});state.idea=state.idea||'';say('Project opened from this browser.');draw();return}try{const response=await fetch('/api/projects/'+encodeURIComponent(id));const result=await response.json();if(!response.ok)throw new Error(result.error||'Open failed');const fresh=initialState(result.project.title);Object.assign(state,fresh,result.project.payload,{projectId:id,projectTitle:result.project.title,dashboard:false,settings:{...fresh.settings,...(result.project.payload.settings||{})}});state.idea=state.idea||'';await refreshProjectList();say('Project opened. Edits autosave to SQLite.');draw()}catch(error){setStorageMode(true);await refreshProjectList();const local=loadBrowserProjects().find(item=>item.id===id);if(local){await openProject(id);return}say('Could not open project: '+error.message,true)}}
function showDashboard(){state.dashboard=true;editingProjectId=null;creatingProject=false;refreshProjectList().then(draw);draw()}
async function saveProjectTitle(id){const title=document.querySelector('#rename-'+CSS.escape(id))?.value.trim();if(!title){say('Project name cannot be blank.',true);return}if(browserStorage){const project=loadBrowserProjects().find(item=>item.id===id);if(!project)return;project.title=title;project.updatedAt=new Date().toISOString();storeBrowserProject(project);if(state.projectId===id)state.projectTitle=title;editingProjectId=null;draw();return}try{const response=await fetch('/api/projects/'+encodeURIComponent(id),{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({title})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Rename failed');const item=projectList.find(p=>p.id===id);if(item)item.title=title;if(state.projectId===id)state.projectTitle=title;editingProjectId=null;draw()}catch(error){setStorageMode(true);await refreshProjectList();await saveProjectTitle(id)}}
async function duplicateProject(id){if(browserStorage){const source=loadBrowserProjects().find(item=>item.id===id);if(!source)return;const copy=JSON.parse(JSON.stringify(source));copy.id=makeProjectId();copy.title='Copy of '+source.title;copy.updatedAt=new Date().toISOString();storeBrowserProject(copy);say('Project duplicated in browser storage.');draw();return}try{const response=await fetch('/api/projects/'+encodeURIComponent(id));const result=await response.json();if(!response.ok)throw new Error(result.error||'Open failed');const title='Copy of '+result.project.title;const created=await fetch('/api/projects',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title,payload:result.project.payload})});const copy=await created.json();if(!created.ok)throw new Error(copy.error||'Duplicate failed');await refreshProjectList();say('Project duplicated. The copy has its own saved workflow state.');draw()}catch(error){setStorageMode(true);await refreshProjectList();await duplicateProject(id)}}
async function deleteProjectAction(id){const item=projectList.find(p=>p.id===id);if(!confirm(`Delete “${item?.title||'this project'}” and its saved references? This cannot be undone.`))return;if(browserStorage){saveBrowserProjects(loadBrowserProjects().filter(project=>project.id!==id));projectList=loadBrowserProjects().map(localProjectSummary);if(state.projectId===id)Object.assign(state,initialState());say('Project deleted from this browser.');draw();return}try{const response=await fetch('/api/projects/'+encodeURIComponent(id),{method:'DELETE'});const result=await response.json();if(!response.ok)throw new Error(result.error||'Delete failed');if(state.projectId===id)Object.assign(state,initialState());await refreshProjectList();say('Project deleted.');draw()}catch(error){setStorageMode(true);await refreshProjectList();await deleteProjectAction(id)}}
function toggleTheme(){const next=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=next;try{localStorage.setItem('ccai-theme',next)}catch{}draw()}
function invalidateBriefInput(previous,next){if(state.brief&&previous!==next){state.brief.approved=false;resetAfterBrief()}}
function readFormIntoState(target){const val=id=>document.querySelector('#'+CSS.escape(id))?.value;const id=target?.id;if(!id)return;if(id==='idea'){const next=val(id)||'';invalidateBriefInput(state.idea,next);state.idea=next}else if(id==='reference'){const next=val(id)||'';invalidateBriefInput(state.reference,next);state.reference=next}else if(id==='referenceText'){const next=val(id)||'';invalidateBriefInput(state.referenceText,next);state.referenceText=next}else if(id==='scriptFormat'){const next=val(id)||'narration';if(state.script&&state.scriptFormat!==next){state.scriptApproved=false;resetAfterScript()}state.scriptFormat=next}else if(id==='referenceVideos'){const next=String(val(id)||'').split(/\n/).map(x=>x.trim()).filter(Boolean);invalidateBriefInput(JSON.stringify(state.settings.referenceVideos||[]),JSON.stringify(next));state.settings.referenceVideos=next}else if(id==='durationMinutes'){const next=Math.min(5,Math.max(1,Number(val(id))||1));invalidateBriefInput(state.settings.durationMinutes,next);state.settings.durationMinutes=next}else if(id==='aspectRatio'){const next=val(id)==='9:16'?'9:16':'16:9';invalidateBriefInput(state.settings.aspectRatio,next);state.settings.aspectRatio=next}else if(id==='language'){const next=val(id);invalidateBriefInput(state.settings.language,next);state.settings.language=next}else if(id==='visualStyle'){const next=val(id);invalidateBriefInput(state.settings.visualStyle,next);state.settings.visualStyle=next;}else if(['seriesId','channelId','brandKitId'].includes(id)){const next=val(id)||'';if(state[id]!==next)invalidateBriefInput(state[id],next);state[id]=next;if(id==='channelId'){const profile=entityRecord('channels',state.channelId);if(profile){state.settings.language=profile.language||state.settings.language;state.settings.durationMinutes=Number(profile.durationMinutes||state.settings.durationMinutes);state.settings.aspectRatio=profile.aspectRatio||state.settings.aspectRatio;state.settings.visualStyle=profile.visualStyle||state.settings.visualStyle;for(const key of ['language','durationMinutes','aspectRatio','visualStyle']){const control=document.querySelector('#'+key);if(control)control.value=state.settings[key]}state.appliedChannelProfile={targetAudience:profile.targetAudience||'',contentCategory:profile.contentCategory||'',storytellingPreferences:profile.storytellingPreferences||''}}else state.appliedChannelProfile=null}}else if(id==='season'||id==='episode')state[id]=Math.max(1,Number(val(id))||1);else if(id==='storyContinuity'){const next=val(id)||'';invalidateBriefInput(state.storyContinuity,next);state.storyContinuity=next}else if(id==='appearanceOverrides'){try{const next=JSON.parse(val(id)||'{}');invalidateBriefInput(JSON.stringify(state.appearanceOverrides||{}),JSON.stringify(next));state.appearanceOverrides=next}catch{say('Appearance overrides must be valid JSON.',true)}}else if(id==='btitle'||id==='bdirection'||id==='baud'){if(state.brief){const key={btitle:'title',bdirection:'direction',baud:'goal'}[id],next=val(id)||'';if(state.brief[key]!==next){state.brief[key]=next;state.brief.approved=false;resetAfterBrief()}}}else if(id==='script'||id==='scriptReview'){const next=val(id)||'';if(next!==state.script){state.script=next;state.scriptApproved=false;resetAfterScript()}}else if(id.startsWith('sceneLocation')){const i=Number(id.slice(13));if(state.scenes[i])if(state.scenes[i].locationId!==(val(id)||'')){state.scenes[i].locationId=val(id)||'';invalidateSceneVisual(i)}}else if(id.startsWith('sceneOutfit')){const i=Number(id.slice(11));if(state.scenes[i]&&state.scenes[i].outfitOverride!==(val(id)||'')){state.scenes[i].outfitOverride=val(id)||'';invalidateSceneVisual(i)}}else if(id==='editnotes'||id==='postnotes')state.notes=val(id)||'';else if(id==='thumbtext')state.thumbnailText=val(id)||'';else if(id==='resolution'){state.renderResolution=val(id);state.settings.aspectRatio=String(val(id)).includes('9:16')?'9:16':'16:9'}else if(id==='format')state.renderFormat=val(id);else if(id.startsWith('prompt')){const i=Number(id.slice(6));if(state.scenes[i]){const next=val(id)||'';if(state.scenes[i].prompt!==next){state.scenes[i].prompt=next;state.scenes[i].image=false;state.scenes[i].approved=false;state.scenes[i].imagePromptUsed='';state.voice=false;state.render=false;state.post=false;state.thumb=false;state.exported=false}}}else if(id.startsWith('reviewPrompt')){const i=Number(id.slice(12));if(state.scenes[i])state.scenes[i].regenerationDraft=val(id)||''}else if(id.startsWith('duration-')){const i=Number(id.slice(9));if(state.scenes[i])state.scenes[i].seconds=Math.min(120,Math.max(1,Number(val(id))||1))}navdraw();scheduleAutosave()}
async function handleReferenceUploads(input){const category=input.dataset.category;const files=Array.from(input.files||[]);const existing=state.settings.referenceImages||[];if(existing.length+files.length>12){say('You can store up to 12 reference images per project.',true);input.value='';return}try{const images=await Promise.all(files.map(file=>new Promise((resolve,reject)=>{if(file.size>2*1024*1024){reject(new Error(`${file.name} is over the 2 MB per-image limit.`));return}if(!/^image\/(png|jpeg|webp|gif)$/.test(file.type)){reject(new Error(`${file.name} is not a supported image.`));return}const reader=new FileReader();reader.onload=()=>resolve({name:file.name,type:file.type,category,dataUrl:reader.result});reader.onerror=()=>reject(new Error(`Could not read ${file.name}.`));reader.readAsDataURL(file)})));state.settings.referenceImages=[...existing,...images];say(`${images.length} reference image${images.length===1?'':'s'} added.`);draw();scheduleAutosave()}catch(error){say(error.message,true)}input.value=''}
function removeReferenceImage(i){state.settings.referenceImages.splice(i,1);draw();scheduleAutosave()}
view.addEventListener('change',event=>{const target=event.target;if(target.matches('[data-scene-array]')){const index=Number(target.dataset.sceneArray);if(state.scenes[index]){const next=[...view.querySelectorAll(`[data-scene-array=\"${index}\"]:checked`)].map(item=>item.value);if(JSON.stringify(next)!==JSON.stringify(state.scenes[index].characterIds||[])){state.scenes[index].characterIds=next;invalidateSceneVisual(index)}}scheduleAutosave();return}if(target.matches('[data-project-array]')){const key=target.dataset.projectArray;const next=[...view.querySelectorAll(`[data-project-array=\"${key}\"]:checked`)].map(item=>item.value);invalidateBriefInput(JSON.stringify(state[key]||[]),JSON.stringify(next));state[key]=next;scheduleAutosave();return}if(target.matches('input[type=file][data-library-collection]'))handleEntityUploads(target)});
